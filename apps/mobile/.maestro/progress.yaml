# Progress tab: the coach's goal shows with its countdown on the overview; the Metrics tile opens Metrics, where the
# latest weight, body fat and muscle from the coach's two seeded scans show in lb (the demo client's units), with the
# 3-month change. Logging, changing and deleting a metric: metrics-log.yaml.
# Run via `pnpm --filter mobile e2e` (starts the helper bridge and passes HELPER_URL).
appId: app.caltracker.client
env:
  EMAIL: client@demo.local
  PASSWORD: demo-password-123
---
- runScript:
    file: helpers/call.js
    env: { ACTION: seed-scans, EMAIL: '${EMAIL}' }
- launchApp:
    clearState: true
- runFlow:
    file: helpers/sign-in.yaml
    env: { EMAIL: '${EMAIL}', PASSWORD: '${PASSWORD}' }
- tapOn:
    id: tab-progress
# The goal the coach set, with its countdown, sits on the overview under "This week".
- extendedWaitUntil:
    visible:
      id: goal-text
    timeout: 20000
- assertVisible: 'Run a 5K under 30 minutes'
- assertVisible:
    id: goal-countdown
    text: '[0-9]+ days to go'
- assertVisible:
    id: goal-date
    text: 'Target date .+'
- assertVisible:
    id: progress-week
- takeScreenshot: progress-overview
# The Metrics tile shows the latest weight and its 3-month change, and opens Metrics: latest numbers in lb (80 kg =
# 176.4 lb, −4.4 lb from 82 kg; 19% body fat; 36 kg = 79.4 lb of muscle), each from the coach's InBody scan.
- assertVisible:
    id: progress-metrics
    text: 'Metrics: 176.4 lb, −4.4 lb in 3 months'
- tapOn:
    id: progress-metrics
- extendedWaitUntil:
    visible:
      id: metric-value-weight_kg
    timeout: 20000
- assertVisible:
    id: metric-value-weight_kg
    text: '176.4'
- assertVisible:
    id: metric-change-weight_kg
    text: '−4.4 lb'
- assertVisible:
    id: metric-meta-weight_kg
    text: '.* · InBody scan'
- assertVisible:
    id: metric-value-body_fat_pct
    text: '19.0'
- assertVisible:
    id: metric-value-smm_kg
    text: '79.4'
- assertVisible:
    id: metric-meta-vo2_max
    text: 'Not logged yet'
- scrollUntilVisible:
    element:
      id: last-scan
- assertVisible: 'Latest InBody scan'
- takeScreenshot: progress-metrics
# The old Body address still opens Metrics.
- openLink: caltracker://progress-detail/body
- extendedWaitUntil:
    visible:
      id: metric-value-weight_kg
    timeout: 20000
# Tidy up.
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-scans, EMAIL: '${EMAIL}' }
