# The whole simple-logging mock-up flow on "E2E Upper/Core", with a screenshot per step:
# overview → Warm-Up start → Arm Circles → Resistance Training start (with "or: Machine Assisted Pull Up") →
# superset 1 round by round → superset 2 with the "Machine taken?" strip → Which one are you doing? → logging the
# substitute → the rope pushdown (W, D, F rows) → Finisher start → pick an option by logging it → Finish workout?
# → stickers → the summary with "Changes from the plan".
# Run via `pnpm --filter mobile e2e` (starts the helper bridge and passes HELPER_URL).
appId: app.caltracker.client
env:
  EMAIL: client@demo.local
  PASSWORD: demo-password-123
---
- runScript:
    file: helpers/call.js
    env: { ACTION: assign-today-mockup, EMAIL: '${EMAIL}' }
- launchApp:
    clearState: true
    permissions: { notifications: allow }
- runFlow:
    file: helpers/sign-in.yaml
    env: { EMAIL: '${EMAIL}', PASSWORD: '${PASSWORD}' }
- extendedWaitUntil:
    visible: 'E2E Upper/Core'
    timeout: 20000
- tapOn: 'Start'

# 1 · Today's workout
- extendedWaitUntil:
    visible:
      id: start-workout
    timeout: 20000
- extendedWaitUntil:
    visible: 'Wide-Grip Lat Pulldown.*Or Machine Assisted Pull Up.*'
    timeout: 10000
- takeScreenshot: mock-01-main
- tapOn:
    id: start-workout

# 2 · Start Warm-Up
- extendedWaitUntil:
    visible:
      id: section-title
      text: 'Warm-Up'
    timeout: 10000
- assertVisible:
    id: section-place
    text: 'Section 1 of 3'
- takeScreenshot: mock-02-start-warm-up
- tapOn:
    id: start-section

# 3 · Arm Circles: a timed exercise, one TIME column
- extendedWaitUntil:
    visible:
      id: exercise-name-0
      text: 'Arm Circles'
    timeout: 10000
- takeScreenshot: mock-03-arm-circles
- tapOn:
    id: tick-0-0-0
- assertVisible:
    id: actual-duration-0-0-0
    text: '0:30'
- tapOn:
    id: page-done

# 4 · Start Resistance Training
- extendedWaitUntil:
    visible:
      id: section-title
      text: 'Resistance Training'
    timeout: 10000
- assertVisible:
    id: section-count
    text: '2 supersets · 5 exercises'
- takeScreenshot: mock-04-start-resistance
- tapOn:
    id: start-section

# 5 · Superset 1, round by round (the curls have 3 sets, the press 4)
- extendedWaitUntil:
    visible:
      id: superset-heading-0
      text: 'Superset 1 · Round 1 of 4'
    timeout: 10000
- tapOn:
    id: tick-0-0-0
- takeScreenshot: mock-05-superset-1
- assertNotVisible:
    id: tick-0-1-3
- tapOn:
    id: mark-all
- extendedWaitUntil:
    visible:
      id: superset-heading-0
      text: 'Superset 1 · Round 4 of 4'
    timeout: 5000
- scrollUntilVisible:
    element:
      id: tick-0-0-3
      text: 'checkbox, checked'
    direction: DOWN
- tapOn:
    id: page-done

# 6 · Superset 2 with the substitute strip
- extendedWaitUntil:
    visible:
      id: superset-heading-1
      text: 'Superset 2 · Round 1 of 2'
    timeout: 10000
- assertVisible:
    id: swap-1-0
    text: 'Substitute available for Wide-Grip Lat Pulldown'
- takeScreenshot: mock-06-superset-2-strip

# 7 · Machine taken: pick the substitute
- tapOn:
    id: substitute-strip-1-0
- extendedWaitUntil:
    visible:
      id: substitute-sheet
    timeout: 5000
- assertVisible: 'Which one are you doing?'
- assertVisible: 'Planned: Wide-Grip Lat Pulldown.*'
- takeScreenshot: mock-07-substitute-sheet
- tapOn:
    id: sub-option-1

# 8 · Logging the substitute, switchable until a set is ticked
- extendedWaitUntil:
    visible:
      id: substitute-doing-1-0
    timeout: 5000
- assertVisible:
    id: exercise-name-1-0
    text: 'A1 · Machine Assisted Pull Up'
- assertVisible:
    id: substitute-switch-1-0
- tapOn:
    id: tick-1-0-0
- assertNotVisible:
    id: substitute-switch-1-0
- takeScreenshot: mock-08-substitute-logged
- tapOn:
    id: mark-all
- tapOn:
    id: page-done
# The rope pushdown: W, a working set, D and F rows.
- extendedWaitUntil:
    visible:
      id: exercise-name-2
      text: 'Triceps Pushdown - Rope Attachment'
    timeout: 10000
- assertVisible:
    id: tag-2-0-3
    text: 'Drop set to failure. What does F mean.*'
- takeScreenshot: mock-08b-drops
- tapOn:
    id: mark-all
- tapOn:
    id: page-done

# 9 · Start Finisher (pick one)
- extendedWaitUntil:
    visible:
      id: section-title
      text: 'Finisher'
    timeout: 10000
- assertVisible:
    id: section-count
    text: 'Pick one of 3 · swipe to choose'
- takeScreenshot: mock-09-start-finisher
- tapOn:
    id: start-section

# 10 · Swipe options, log one
- extendedWaitUntil:
    visible:
      id: option-line-0
    timeout: 10000
- swipe:
    start: 90%,30%
    end: 10%,30%
- extendedWaitUntil:
    visible:
      id: exercise-name-1
      text: 'Farmer’s Walk|Farmer.s Walk'
    timeout: 5000
- tapOn:
    id: dot-0
- extendedWaitUntil:
    visible:
      id: exercise-name-0
      text: 'Overhead Slam'
    timeout: 5000
- tapOn:
    id: tick-0-0-0
- extendedWaitUntil:
    visible:
      id: option-line-0
      text: 'Option 1 of 3 · you’re doing this one'
    timeout: 5000
- takeScreenshot: mock-10-option-picked
- tapOn:
    id: page-done

# 11 · Finish workout
- extendedWaitUntil:
    visible:
      id: finish-sheet
    timeout: 10000
- assertVisible:
    id: finish-count
    text: '17 of 18 sets done. 1 set of Overhead Slam isn’t ticked; it’ll be saved as not done.'
- tapOn:
    id: feel-Good
- tapOn:
    id: finish-note
- inputText: 'Lat pulldown was taken, did assisted pull ups.'
- tapOn: 'Finish workout?'
- takeScreenshot: mock-11-finish
- runFlow: helpers/finish-from-sheet.yaml

# 12 · Summary
- extendedWaitUntil:
    visible:
      id: summary-changes
    timeout: 10000
- assertVisible: '⇄ Did Machine Assisted Pull Up instead of Wide-Grip Lat Pulldown'
- assertVisible: 'Finisher: picked Overhead Slam'
- takeScreenshot: mock-12-summary
- tapOn:
    id: summary-done
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-logs, EMAIL: '${EMAIL}' }
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-workouts, EMAIL: '-' }
