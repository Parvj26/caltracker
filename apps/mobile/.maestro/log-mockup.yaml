# The whole simple-logging mock-up flow on "E2E Upper/Core", with a screenshot per step:
# Start goes straight to Arm Circles → the overview (title) with "or: Machine Assisted Pull Up" → superset A round by
# round → superset B with the "Machine taken?" strip → Which one are you doing? → logging the substitute → the rope
# pushdown (W and ↓ Drop rows) → the Finisher's switch → Finish workout? → stickers → the summary with "Changes from
# the plan".
# Run via `pnpm --filter mobile e2e` (starts the helper bridge and passes HELPER_URL).
appId: app.caltracker.client
env:
  EMAIL: client@demo.local
  PASSWORD: demo-password-123
---
- runScript:
    file: helpers/call.js
    env: { ACTION: assign-today-mockup, EMAIL: '${EMAIL}' }
- launchApp:
    clearState: true
    permissions: { notifications: allow }
- runFlow:
    file: helpers/sign-in.yaml
    env: { EMAIL: '${EMAIL}', PASSWORD: '${PASSWORD}' }
- extendedWaitUntil:
    visible: 'E2E Upper/Core'
    timeout: 20000
- tapOn: 'Start workout'

# 1 · Arm Circles: a timed exercise, one TIME column (Start goes straight to it)
- extendedWaitUntil:
    visible:
      id: exercise-name-0
      text: 'Arm Circles'
    timeout: 20000
- takeScreenshot: mock-03-arm-circles
# 2 · The title opens the whole workout
- tapOn:
    id: pages-title
- extendedWaitUntil:
    visible: 'Wide-Grip Lat Pulldown.*Or Machine Assisted Pull Up.*'
    timeout: 10000
- takeScreenshot: mock-01-main
- tapOn:
    id: overview-close
- extendedWaitUntil:
    visible:
      id: exercise-name-0
      text: 'Arm Circles'
    timeout: 10000
- tapOn:
    id: tick-0-0-0
- assertVisible:
    id: actual-duration-0-0-0
    text: '0:30'
- tapOn:
    id: page-done

# 5 · Superset A, round by round (the curls have 3 sets, the press 4)
- extendedWaitUntil:
    visible:
      id: superset-heading-0
      text: 'Superset A'
    timeout: 10000
- assertVisible:
    id: round-heading-0-1
    text: 'Round 1 of 4, current round'
- tapOn:
    id: tick-0-0-0
- takeScreenshot: mock-05-superset-1
- assertNotVisible:
    id: tick-0-1-3
- runFlow:
    file: helpers/mark-all.yaml
    env: { PAGE: '0' }
- scrollUntilVisible:
    element:
      id: tick-0-0-3
      text: 'checkbox, checked'
    direction: DOWN
- tapOn:
    id: page-done

# 6 · Superset 2 with the substitute strip
- extendedWaitUntil:
    visible:
      id: superset-heading-1
      text: 'Superset B'
    timeout: 10000
- assertVisible:
    id: round-heading-1-1
    text: 'Round 1 of 2, current round'
- assertVisible:
    id: swap-1-0
    text: 'Substitute available for Wide-Grip Lat Pulldown'
- takeScreenshot: mock-06-superset-2-strip

# 7 · Machine taken: pick the substitute
- tapOn:
    id: substitute-strip-1-0
- extendedWaitUntil:
    visible:
      id: substitute-sheet
    timeout: 5000
- assertVisible: 'Which one are you doing?'
- assertVisible: 'Planned: Wide-Grip Lat Pulldown.*'
- takeScreenshot: mock-07-substitute-sheet
- tapOn:
    id: sub-option-1

# 8 · Logging the substitute, switchable until a set is ticked
- extendedWaitUntil:
    visible:
      id: substitute-doing-1-0
    timeout: 5000
- assertVisible:
    id: exercise-name-1-0
    text: 'Machine Assisted Pull Up'
- assertVisible:
    id: substitute-switch-1-0
- tapOn:
    id: tick-1-0-0
- assertNotVisible:
    id: substitute-switch-1-0
- takeScreenshot: mock-08-substitute-logged
- runFlow:
    file: helpers/mark-all.yaml
    env: { PAGE: '1' }
- tapOn:
    id: page-done
# The rope pushdown: W, a working set, D and F rows.
- extendedWaitUntil:
    visible:
      id: exercise-name-2
      text: 'Triceps Pushdown - Rope Attachment'
    timeout: 10000
- assertVisible:
    id: tag-2-0-3
    text: 'Drop set to failure. What does ↓ Drop mean.*'
- takeScreenshot: mock-08b-drops
- runFlow:
    file: helpers/mark-all.yaml
    env: { PAGE: '2' }
- tapOn:
    id: page-done

# 9 · Finisher: one page with a switch; choosing is free until a set is ticked
- extendedWaitUntil:
    visible:
      id: option-line-0
    timeout: 10000
- takeScreenshot: mock-09-finisher
- tapOn:
    id: option-0-1
- extendedWaitUntil:
    visible:
      id: exercise-name-0
      text: 'Farmer’s Walk|Farmer.s Walk'
    timeout: 5000
- tapOn:
    id: option-0-0
- extendedWaitUntil:
    visible:
      id: exercise-name-0
      text: 'Overhead Slam'
    timeout: 5000
- tapOn:
    id: tick-0-0-0
- extendedWaitUntil:
    visible:
      id: option-line-0
      text: 'You’re doing Overhead Slam.*'
    timeout: 5000
- takeScreenshot: mock-10-option-picked
- tapOn:
    id: page-done

# 11 · Finish workout
- extendedWaitUntil:
    visible:
      id: finish-sheet
    timeout: 10000
- assertVisible:
    id: finish-count
    text: '17 of 18 sets done. 1 set of Overhead Slam isn’t ticked; it’ll be saved as not done.'
- tapOn:
    id: feel-Good
- tapOn:
    id: finish-note
- inputText: 'Lat pulldown was taken, did assisted pull ups.'
- hideKeyboard
- takeScreenshot: mock-11-finish
- runFlow: helpers/finish-from-sheet.yaml

# 12 · Summary
- extendedWaitUntil:
    visible:
      id: summary-changes
    timeout: 10000
- assertVisible: '.*⇄ Did Machine Assisted Pull Up instead of Wide-Grip Lat Pulldown.*'
- assertVisible: '.*Finisher: picked Overhead Slam.*'
- assertVisible: '.*Overhead Slam: 1 of 2 sets.*'
- takeScreenshot: mock-12-summary
- tapOn:
    id: summary-done
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-logs, EMAIL: '${EMAIL}' }
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-workouts, EMAIL: '-' }
