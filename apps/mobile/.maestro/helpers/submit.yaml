# Taps the form's submit button (it sits above the keyboard, since the screen scrolls the focused field up).
# No hideKeyboard first: on this simulator Maestro's hideKeyboard taps the screen where the keyboard was, which can
# land on the Privacy link under the form and open Safari instead.
appId: app.caltracker.client
---
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: submit-button
    commands:
      - tapOn:
          id: submit-button
