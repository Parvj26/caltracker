# From Today: Start goes straight to the first set (no overview or Start section in between, approved Today board,
# 2026-11-19). Waits for the first page. Inputs (env): NAME (the workout's name on Today).
appId: app.caltracker.client
---
- extendedWaitUntil:
    visible: '${NAME}'
    timeout: 20000
- tapOn: 'Start workout'
- extendedWaitUntil:
    visible:
      id: pages-title
    timeout: 20000
- assertVisible:
    id: page-0
# The bottom button (Next / Finish workout) waits for the first ticked set.
- assertNotVisible:
    id: page-done
