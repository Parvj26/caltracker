# From Today: Start, then the workout overview's Start workout, then the first section's Start section. Waits for
# the first page's Done. Inputs (env): NAME (the workout's name on Today).
appId: app.caltracker.client
---
- extendedWaitUntil:
    visible: '${NAME}'
    timeout: 20000
- tapOn: 'Start'
- extendedWaitUntil:
    visible:
      id: start-workout
    timeout: 20000
- assertVisible:
    id: start-workout
    text: 'Start workout'
- tapOn:
    id: start-workout
- extendedWaitUntil:
    visible:
      id: start-section
    timeout: 10000
- tapOn:
    id: start-section
- extendedWaitUntil:
    visible:
      id: page-done
    timeout: 10000
