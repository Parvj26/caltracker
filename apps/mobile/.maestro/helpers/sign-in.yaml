# Signs in on a fresh install and waits for Today. Inputs (env): EMAIL, PASSWORD.
appId: app.caltracker.client
---
- tapOn:
    id: email-input
- inputText: ${EMAIL}
- tapOn:
    id: password-input
- inputText: ${PASSWORD}
- runFlow: submit.yaml
# iOS may offer to save the password; dismiss it if shown.
- tapOn:
    text: Not Now
    optional: true
- extendedWaitUntil:
    visible: 'Welcome to Demo Coaching'
    timeout: 20000
