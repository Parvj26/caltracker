# Signs in on a fresh install and waits for Today. Inputs (env): EMAIL, PASSWORD.
appId: app.caltracker.client
---
- tapOn:
    id: email-input
- inputText: ${EMAIL}
- tapOn:
    id: password-input
# The focus must have moved before typing, or the password lands in the email box.
- waitForAnimationToEnd
- inputText: ${PASSWORD}
- runFlow: submit.yaml
# iOS may offer to save the password; dismiss it if shown.
- tapOn:
    text: Not Now
    optional: true
# A slow save-password prompt can cover Today while it loads: keep putting it away until Today shows.
- repeat:
    times: 6
    while:
      notVisible:
        id: today-greeting
    commands:
      - tapOn:
          text: Not Now
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible:
      id: today-greeting
    timeout: 20000
# The save-password prompt can also arrive after Today shows.
- waitForAnimationToEnd
- tapOn:
    text: Not Now
    optional: true
