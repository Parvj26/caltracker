# Closing the app mid-workout never loses a ticked set. Start, tick set 1, close the app, open it again (same
# install, no clearState): Today's card says "1 of 3 sets" with Continue, which opens on the exercise with set 1 still
# ticked. The title opens the overview; × offers Keep going later or Discard workout.
# Run via `pnpm --filter mobile e2e` (starts the helper bridge and passes HELPER_URL).
appId: app.caltracker.client
env:
  EMAIL: client@demo.local
  PASSWORD: demo-password-123
---
- runScript:
    file: helpers/call.js
    env: { ACTION: assign-today, EMAIL: '${EMAIL}' }
- launchApp:
    clearState: true
    permissions: { notifications: allow }
- runFlow:
    file: helpers/sign-in.yaml
    env: { EMAIL: '${EMAIL}', PASSWORD: '${PASSWORD}' }
- runFlow:
    file: helpers/start-first-section.yaml
    env: { NAME: 'E2E Log' }
- tapOn:
    id: tick-0-0-0
- assertVisible:
    id: tick-0-0-0
    text: 'checkbox, checked'
- stopApp
- launchApp
# Today's card says it is going: progress and Continue.
- extendedWaitUntil:
    visible:
      id: 'today-progress-.*'
      text: '1 of 3 sets.*'
    timeout: 20000
- assertVisible: 'Continue'
- tapOn: 'Continue'
# It opens straight on the first page with an open set.
- extendedWaitUntil:
    visible:
      id: pages-title
    timeout: 20000
# iOS reads a checkbox's state as its value ("checkbox, checked"), which Maestro matches as text.
- assertVisible:
    id: tick-0-0-0
    text: 'checkbox, checked'
- assertVisible:
    id: tick-0-0-1
    text: 'checkbox, unchecked'
# The title opens the whole workout; ⌄ comes back to the sets.
- tapOn:
    id: pages-title
- extendedWaitUntil:
    visible:
      id: workout-overview
    timeout: 10000
- tapOn:
    id: overview-close
- extendedWaitUntil:
    visible:
      id: pages-title
    timeout: 10000
# ×: Keep going later leaves for Today; the workout keeps going.
- tapOn:
    id: close-section
- tapOn: 'Keep going later'
- extendedWaitUntil:
    visible: 'Continue'
    timeout: 10000
- tapOn: 'Continue'
- extendedWaitUntil:
    visible:
      id: pages-title
    timeout: 10000
# Leave nothing in progress for the next flow: × → Discard workout → Discard.
- tapOn:
    id: close-section
- tapOn: 'Discard workout'
- tapOn: 'Discard'
- extendedWaitUntil:
    visible: 'Start workout'
    timeout: 20000
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-logs, EMAIL: '${EMAIL}' }
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-workouts, EMAIL: '-' }
