# Closing the app mid-workout never loses a ticked set. Start, tick set 1, close the app, open it again (same
# install, no clearState): Today offers Resume, the screen opens on the exercise with set 1 still ticked. ✕ goes
# back to the section start, ⌄ to the overview, and the workout keeps going until it is discarded there.
# Run via `pnpm --filter mobile e2e` (starts the helper bridge and passes HELPER_URL).
appId: app.caltracker.client
env:
  EMAIL: client@demo.local
  PASSWORD: demo-password-123
---
- runScript:
    file: helpers/call.js
    env: { ACTION: assign-today, EMAIL: '${EMAIL}' }
- launchApp:
    clearState: true
    permissions: { notifications: allow }
- runFlow:
    file: helpers/sign-in.yaml
    env: { EMAIL: '${EMAIL}', PASSWORD: '${PASSWORD}' }
- runFlow:
    file: helpers/start-first-section.yaml
    env: { NAME: 'E2E Log' }
- tapOn:
    id: tick-0-0-0
- assertVisible:
    id: tick-0-0-0
    text: 'checkbox, checked'
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: resume-banner
    timeout: 20000
- assertVisible: '.*Resume E2E Log.*'
- tapOn:
    id: resume-banner
# Something is ticked, so it opens straight on the first page with an open set.
- extendedWaitUntil:
    visible:
      id: page-done
    timeout: 20000
# iOS reads a checkbox's state as its value ("checkbox, checked"), which Maestro matches as text.
- assertVisible:
    id: tick-0-0-0
    text: 'checkbox, checked'
- assertVisible:
    id: tick-0-0-1
    text: 'checkbox, unchecked'
# ✕: back to the section's start page, which now says Continue.
- tapOn:
    id: close-section
- extendedWaitUntil:
    visible:
      id: start-section
      text: 'Continue section'
    timeout: 10000
# ⌄: the workout overview, still going.
- tapOn:
    id: section-back
- extendedWaitUntil:
    visible:
      id: start-workout
      text: 'Continue'
    timeout: 10000
# ✕ on the overview leaves for Today; the workout keeps going.
- tapOn:
    id: overview-close
- extendedWaitUntil:
    visible:
      id: resume-banner
    timeout: 10000
- tapOn:
    id: resume-banner
# Coming back opens where it was left: the overview.
- extendedWaitUntil:
    visible:
      id: workout-overview
    timeout: 10000
# Leave nothing in progress for the next flow.
- scrollUntilVisible:
    element:
      id: discard-workout
    direction: DOWN
- tapOn:
    id: discard-workout
- tapOn: 'Discard'
- extendedWaitUntil:
    visible: 'Start'
    timeout: 20000
- assertNotVisible:
    id: resume-banner
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-logs, EMAIL: '${EMAIL}' }
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-workouts, EMAIL: '-' }
