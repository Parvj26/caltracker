# The sticker reveal after Finish: a seeded workout of 3 x 8 at 60 kg is 1,440 kg, which is a giraffe's worth.
# Finish shows the dark reveal (what was lifted, the animal, "NEW for your zoo book", Continue), then the summary
# with its sticker row ("Giraffe ×1"). The demo client starts with an empty zoo book (cleanup-logs clears it).
# Run via `pnpm --filter mobile e2e` (starts the helper bridge and passes HELPER_URL; the award-workout Edge
# Function must be served: `supabase functions serve`).
appId: app.caltracker.client
env:
  EMAIL: client@demo.local
  PASSWORD: demo-password-123
---
- runScript:
    file: helpers/call.js
    env: { ACTION: assign-today, EMAIL: '${EMAIL}' }
- launchApp:
    clearState: true
    # Granted up front: tapping the system's Allow could land on the page underneath as the alert closes.
    permissions: { notifications: allow }
- runFlow:
    file: helpers/sign-in.yaml
    env: { EMAIL: '${EMAIL}', PASSWORD: '${PASSWORD}' }
- extendedWaitUntil:
    visible: 'E2E Log'
    timeout: 20000
- tapOn: 'Start'
- extendedWaitUntil:
    visible:
      id: done-0
    timeout: 20000
# Done on each of the three sets (sets 1 and 2 start a rest, which is skipped; the last set starts none).
- tapOn:
    id: done-0
- tapOn:
    id: rest-skip
- tapOn:
    id: done-0
- tapOn:
    id: rest-skip
- tapOn:
    id: done-0
- extendedWaitUntil:
    visible:
      id: all-done-0
    timeout: 10000
# Finish from the exercise's "All sets done" card.
- tapOn:
    id: finish-all-0
# The reveal: 1,440 kg is 3,175 lb in this client's units, and about 1.x giraffes.
- extendedWaitUntil:
    visible:
      id: reveal-continue
    timeout: 15000
- assertVisible: 'You lifted 3,175 lb'
- assertVisible: 'that’s about'
- assertVisible:
    id: reveal-headline
    text: '.*Giraffe.*'
# The server's answer lands a moment after the card shows: a first giraffe is NEW for the zoo book.
- extendedWaitUntil:
    visible: 'NEW for your zoo book'
    timeout: 10000
# Then the week-1 landmark and "Workout #1" (a first workout of a fresh streak); step through them all.
- runFlow: helpers/reveal-through.yaml
# Summary: the sticker row with the count.
- extendedWaitUntil:
    visible: '3 sets completed'
    timeout: 10000
- assertVisible:
    id: summary-stickers
- extendedWaitUntil:
    visible: 'Giraffe ×1'
    timeout: 10000
- tapOn:
    id: summary-done
- extendedWaitUntil:
    visible: 'Done ✓.*'
    timeout: 20000
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-logs, EMAIL: '${EMAIL}' }
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-workouts, EMAIL: '-' }
