# The coach assigns a 1-week program starting today; the seed client sees it on Today, opens the read-only
# detail, and finds it on the Workouts week view. A client with a workout never sees the first-time welcome.
# Run via `pnpm --filter mobile e2e` (starts the helper bridge and passes HELPER_URL).
appId: app.caltracker.client
env:
  EMAIL: client@demo.local
  PASSWORD: demo-password-123
---
- runScript:
    file: helpers/call.js
    env: { ACTION: assign, EMAIL: '${EMAIL}' }
- launchApp:
    clearState: true
- tapOn:
    id: email-input
- inputText: ${EMAIL}
- tapOn:
    id: password-input
- inputText: ${PASSWORD}
- runFlow: helpers/submit.yaml
# iOS may offer to save the password; dismiss it if shown.
- tapOn:
    text: Not Now
    optional: true
- extendedWaitUntil:
    visible: 'Welcome to Demo Coaching'
    timeout: 20000
- extendedWaitUntil:
    visible: 'E2E Upper'
    timeout: 20000
- assertNotVisible: 'Your first workout is coming!'
- assertNotVisible:
    id: units-kg
- tapOn: 'See the plan'
# The exercise row is one button whose label is the name, the set count and the set summary.
- extendedWaitUntil:
    visible: 'Barbell Squat.*'
    timeout: 20000
# What to bring: the squat's barbell, as a chip under the title.
- extendedWaitUntil:
    visible:
      id: preview-equipment
    timeout: 20000
- assertVisible: 'Barbell'
# Collapsed, the sets read as one line (weight first, drops marked ↓ and not counted): one set.
# New accounts start in pounds (US launch): the coach's 60 kg target shows as 132 lb to this client.
- assertVisible: 'Barbell Squat, 1 set: 132 lb × 8, ↓ To failure'
- assertNotVisible:
    id: drop-set
# Tapping the exercise shows each set.
- tapOn:
    id: 'preview-expand-.*'
- assertVisible: '8 reps · 132 lb'
# The drop row's label is read as "Drop set" (iOS shows the accessibility label, not the ↳ glyph).
- assertVisible:
    id: drop-set
- assertVisible: 'Drop set'
- assertVisible: 'To failure'
# Read only in phase 2: there is no Start button.
- assertNotVisible: 'Start'
- tapOn:
    id: back
- tapOn:
    id: tab-workouts
- runScript:
    file: helpers/week-of.js
- assertVisible: ${output.weekOf}
- assertVisible:
    id: today-chip
# React Native flattens the row's views, so "inside today-row" can't be matched. The lime chip only renders
# on today's date, and this client's only workout is E2E Upper, so these two prove today's row shows it.
- assertVisible:
    id: today-chip
- assertVisible: 'E2E Upper'
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-workouts, EMAIL: '-' }
