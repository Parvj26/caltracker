# The Progress tab after a finished workout: finish a 3 x 8 at 60 kg, then open Progress. The strength chart for
# the exercise shows with its readout and text summary. Run via `pnpm --filter mobile e2e`.
appId: app.caltracker.client
env:
  EMAIL: client@demo.local
  PASSWORD: demo-password-123
---
- runScript:
    file: helpers/call.js
    env: { ACTION: assign-today, EMAIL: '${EMAIL}' }
- launchApp:
    clearState: true
- runFlow:
    file: helpers/sign-in.yaml
    env: { EMAIL: '${EMAIL}', PASSWORD: '${PASSWORD}' }
- extendedWaitUntil:
    visible: 'E2E Log'
    timeout: 20000
- tapOn: 'Start'
- tapOn:
    text: Allow
    optional: true
- extendedWaitUntil:
    visible:
      id: tick-0-0
    timeout: 20000
- tapOn:
    id: tick-0-0
- tapOn:
    id: rest-skip
- tapOn:
    id: tick-0-1
- tapOn:
    id: rest-skip
- tapOn:
    id: tick-0-2
- tapOn:
    id: rest-skip
- tapOn:
    id: log-menu
- tapOn:
    id: finish-button
- extendedWaitUntil:
    visible: 'NEW for your zoo book'
    timeout: 15000
- tapOn:
    id: reveal-continue
- extendedWaitUntil:
    visible: 'Giraffe ×1'
    timeout: 10000
- tapOn:
    id: summary-done
- extendedWaitUntil:
    visible: 'Done ✓.*'
    timeout: 20000
- tapOn:
    id: tab-progress
- extendedWaitUntil:
    visible:
      id: strength-chart
    timeout: 10000
- assertVisible:
    id: strength-readout
    text: '.*estimated 1RM.*'
- assertVisible:
    id: strength-summary
    text: '.*workouts?\..*'
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-logs, EMAIL: '${EMAIL}' }
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-workouts, EMAIL: '-' }
