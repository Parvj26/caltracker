# The Progress tab after a finished workout: finish a 3 x 8 at 60 kg, then open Progress. The strength chart for
# the exercise shows with its readout and text summary. Run via `pnpm --filter mobile e2e`.
appId: app.caltracker.client
env:
  EMAIL: client@demo.local
  PASSWORD: demo-password-123
---
- runScript:
    file: helpers/call.js
    env: { ACTION: assign-today, EMAIL: '${EMAIL}' }
- launchApp:
    clearState: true
    # Granted up front: tapping the system's Allow could land on the page underneath as the alert closes.
    permissions: { notifications: allow }
- runFlow:
    file: helpers/sign-in.yaml
    env: { EMAIL: '${EMAIL}', PASSWORD: '${PASSWORD}' }
- extendedWaitUntil:
    visible: 'E2E Log'
    timeout: 20000
- tapOn: 'Start'
- extendedWaitUntil:
    visible:
      id: done-0
    timeout: 20000
# Done on each of the three sets (sets 1 and 2 start a rest, which is skipped; the last set starts none).
- tapOn:
    id: done-0
- tapOn:
    id: rest-skip
- tapOn:
    id: done-0
- tapOn:
    id: rest-skip
- tapOn:
    id: done-0
- extendedWaitUntil:
    visible:
      id: all-done-0
    timeout: 10000
# Finish from the top bar.
- tapOn:
    id: finish-workout
- extendedWaitUntil:
    visible: 'NEW for your zoo book'
    timeout: 15000
- runFlow: helpers/reveal-through.yaml
- extendedWaitUntil:
    visible: 'Giraffe ×1'
    timeout: 10000
- tapOn:
    id: summary-done
- extendedWaitUntil:
    visible: 'Done ✓.*'
    timeout: 20000
- tapOn:
    id: tab-progress
- extendedWaitUntil:
    visible:
      id: strength-chart
    timeout: 10000
- assertVisible:
    id: strength-readout
    text: '.*estimated 1RM.*'
- assertVisible:
    id: strength-summary
    text: '.*workouts?\..*'
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-logs, EMAIL: '${EMAIL}' }
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-workouts, EMAIL: '-' }
