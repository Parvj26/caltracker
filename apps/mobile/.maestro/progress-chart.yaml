# The Progress tab after a finished workout: finish a 3 x 8 at 60 kg, then open Progress. The strength chart for
# the exercise shows with its readout and text summary. Run via `pnpm --filter mobile e2e`.
appId: app.caltracker.client
env:
  EMAIL: client@demo.local
  PASSWORD: demo-password-123
---
- runScript:
    file: helpers/call.js
    env: { ACTION: assign-today, EMAIL: '${EMAIL}' }
- launchApp:
    clearState: true
    # Granted up front: tapping the system's Allow could land on the page underneath as the alert closes.
    permissions: { notifications: allow }
- runFlow:
    file: helpers/sign-in.yaml
    env: { EMAIL: '${EMAIL}', PASSWORD: '${PASSWORD}' }
# Tick the three sets (no rest timer), Done, then Finish on the Finish workout? sheet.
- runFlow: helpers/log-squat-3x8.yaml
- tapOn:
    id: finish-confirm
- extendedWaitUntil:
    visible: 'NEW for your zoo book'
    timeout: 15000
- runFlow: helpers/reveal-through.yaml
- extendedWaitUntil:
    visible: 'Giraffe ×1'
    timeout: 10000
- tapOn:
    id: summary-done
- extendedWaitUntil:
    visible: 'Done ✓.*'
    timeout: 20000
- tapOn:
    id: tab-progress
- extendedWaitUntil:
    visible:
      id: strength-chart
    timeout: 10000
- assertVisible:
    id: strength-readout
    text: '.*estimated 1RM.*'
- assertVisible:
    id: strength-summary
    text: '.*workouts?\..*'
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-logs, EMAIL: '${EMAIL}' }
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-workouts, EMAIL: '-' }
