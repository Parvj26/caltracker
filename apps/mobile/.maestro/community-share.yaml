# Share to community from a workout summary and from the zoo book: finish "E2E Log" (3 x 8 at 60 kg, one animal up
# to a giraffe, picked at random for a new client), tap "Share to community" on the summary, post the card with a
# caption, then share that animal's sticker (the only owned tile, so `sticker-.*` finds it) from the zoo book.
# Run via `pnpm --filter mobile e2e`.
appId: app.caltracker.client
env:
  EMAIL: client@demo.local
  PASSWORD: demo-password-123
---
- runScript:
    file: helpers/call.js
    env: { ACTION: community-cleanup, EMAIL: '-' }
- runScript:
    file: helpers/call.js
    env: { ACTION: assign-today, EMAIL: '${EMAIL}' }
- launchApp:
    clearState: true
    permissions: { notifications: allow }
- runFlow:
    file: helpers/sign-in.yaml
    env: { EMAIL: '${EMAIL}', PASSWORD: '${PASSWORD}' }
- extendedWaitUntil:
    visible: 'E2E Log'
    timeout: 20000
- tapOn: 'Start'
- extendedWaitUntil:
    visible:
      id: start-workout
    timeout: 20000
- tapOn:
    id: start-workout
- extendedWaitUntil:
    visible:
      id: start-section
    timeout: 10000
- tapOn:
    id: start-section
- extendedWaitUntil:
    visible:
      id: tick-0-0-0
    timeout: 10000
- tapOn:
    id: tick-0-0-0
- tapOn:
    id: tick-0-0-1
- tapOn:
    id: tick-0-0-2
- tapOn:
    id: page-done
- runFlow: helpers/finish-from-sheet.yaml

# The workout card, from the summary.
- scrollUntilVisible:
    element:
      id: summary-share
- tapOn:
    id: summary-share
- extendedWaitUntil:
    visible: 'Share to community'
    timeout: 10000
- assertVisible: 'Your workout card'
- tapOn:
    id: new-post-body
- inputText: 'E2E Leg day done'
# Not hideKeyboard: on the composer it can land on Post or Add photos. Tap the empty right end of the Cancel row.
- tapOn:
    point: '85%,12%'
- tapOn:
    id: new-post-submit
- extendedWaitUntil:
    visible:
      id: summary-done
    timeout: 15000
- tapOn:
    id: summary-done

# The sticker card, from the zoo book.
- tapOn:
    id: tab-zoo
- scrollUntilVisible:
    element:
      id: 'sticker-.*'
- tapOn:
    id: 'sticker-.*'
- tapOn:
    id: sheet-share
- extendedWaitUntil:
    visible: 'Share to community'
    timeout: 10000
- assertVisible: 'Your .+ sticker'
- tapOn:
    id: new-post-submit

# Both cards are in the feed.
- tapOn:
    id: tab-coach
- tapOn:
    id: open-community
- extendedWaitUntil:
    visible: 'E2E Leg day done'
    timeout: 15000
- assertVisible: 'New sticker'
- assertVisible: 'Workout done'
# Built by the database from the log and its award: counts and the animal, no volume.
- assertVisible: '1 exercise · 3 sets'
- assertVisible: '≈ .+'

- runScript:
    file: helpers/call.js
    env: { ACTION: community-cleanup, EMAIL: '-' }
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-logs, EMAIL: '${EMAIL}' }
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-workouts, EMAIL: '-' }
