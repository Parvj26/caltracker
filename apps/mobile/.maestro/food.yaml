# Food tab: with the coach's targets (2,000 kcal, 150 g protein; carbs and fat blank), type in a meal (Maestro toast,
# 300 kcal, 12 g protein), see it under Today's meals and in the kcal card, log it again from "Log again in one tap",
# find it with "Search your meals" and Use it, edit a meal, look at yesterday in the day strip, then delete all three. Photos need the camera, so they are not covered.
# Run via `pnpm --filter mobile e2e` (starts the helper bridge and passes HELPER_URL).
appId: app.caltracker.client
env:
  EMAIL: client@demo.local
  PASSWORD: demo-password-123
---
- runScript:
    file: helpers/call.js
    env: { ACTION: seed-food-targets, EMAIL: '${EMAIL}' }
- launchApp:
    clearState: true
- runFlow:
    file: helpers/sign-in.yaml
    env: { EMAIL: '${EMAIL}', PASSWORD: '${PASSWORD}' }
- tapOn:
    id: tab-food
- assertVisible:
    id: food-day
    text: 'Today’s meals'
- extendedWaitUntil:
    visible: 'No meals yet today.'
    timeout: 10000
- assertVisible:
    id: food-kcal-caption
    text: 'kcal left today'
- assertVisible:
    id: food-kcal-headline
    text: '2,000'
- assertVisible:
    id: food-targets-by
    text: 'Targets set by .*'

# Type it in.
- tapOn:
    id: food-type-it
- tapOn:
    id: meal-name
- inputText: 'Maestro toast'
- tapOn:
    id: meal-protein
- inputText: '12'
# No calories yet: the hint works them out from the protein (12 x 4).
- scrollUntilVisible:
    element:
      id: meal-kcal-hint
- assertVisible: '≈ 48 kcal from macros'
- tapOn:
    id: meal-calories
- inputText: '300'
# Not hideKeyboard: the number pad has no return key and it can leave the pad up, so Save's tap lands on a key.
# Tapping plain text closes the keyboard instead.
- tapOn: 'Only know some numbers\? .*'
- scrollUntilVisible:
    element:
      id: meal-save
- tapOn:
    id: meal-save
- extendedWaitUntil:
    visible: 'Maestro toast, .*'
    timeout: 10000
- assertVisible: 'Maestro toast, .*, 300 kcal · 12 P'
- assertVisible:
    id: food-kcal-headline
    text: '1,700'
- assertVisible:
    id: food-bar-protein
    text: '12 / 150 g · 138 left'
- extendedWaitUntil:
    notVisible: 'Saving…'
    timeout: 20000

# Log it again in one tap: two cards.
- extendedWaitUntil:
    visible:
      id: 'food-again-Maestro toast'
    timeout: 10000
- tapOn:
    id: 'food-again-Maestro toast'
- extendedWaitUntil:
    visible:
      id: food-kcal-headline
      text: '1,400'
    timeout: 10000
- extendedWaitUntil:
    notVisible: 'Saving…'
    timeout: 20000

# Search your meals: "toa" finds it; Use fills the form.
- tapOn:
    id: food-type-it
- tapOn:
    id: meal-search
- inputText: 'toa'
- tapOn:
    id: 'meal-use-Maestro toast'
- assertVisible:
    id: meal-name
    text: 'Maestro toast'
- assertVisible:
    id: meal-calories
    text: '300'
- hideKeyboard
- tapOn:
    id: meal-save
- extendedWaitUntil:
    visible:
      id: food-kcal-headline
      text: '1,100'
    timeout: 10000
- extendedWaitUntil:
    notVisible: 'Saving…'
    timeout: 20000

# Edit one. Scroll it clear of the tab bar first, or the tap lands on a tab.
- scrollUntilVisible:
    element:
      text: 'Maestro toast, .*'
    centerElement: true
- tapOn:
    text: 'Maestro toast, .*'
    index: 0
- assertVisible: 'Edit meal'
- tapOn:
    id: meal-calories
- eraseText: 5
- inputText: '350'
# Not hideKeyboard: the number pad has no return key and it can leave the pad up, so Save's tap lands on a key.
# Tapping plain text closes the keyboard instead.
- tapOn: 'Only know some numbers\? .*'
- scrollUntilVisible:
    element:
      id: meal-save
- tapOn:
    id: meal-save
- extendedWaitUntil:
    visible:
      id: food-kcal-headline
      text: '1,050'
    timeout: 10000

# Yesterday in the strip is empty; today is the last day (the strip's other six days, oldest first, end with yesterday).
- scrollUntilVisible:
    element:
      id: food-day-today
    direction: UP
- tapOn:
    id: 'food-day-\d{4}-\d{2}-\d{2}'
    index: 5
- assertVisible:
    id: food-day
    text: 'Meals on .*'
- assertVisible: 'No meals logged this day.'
- tapOn:
    id: food-day-today
- assertVisible:
    id: food-day
    text: 'Today’s meals'

# Delete all three.
- repeat:
    times: 3
    commands:
      - scrollUntilVisible:
          element:
            text: 'Maestro toast, .*'
          centerElement: true
      - tapOn:
          text: 'Maestro toast, .*'
          index: 0
      - scrollUntilVisible:
          element:
            id: meal-delete
      - tapOn:
          id: meal-delete
      - tapOn: Delete
- extendedWaitUntil:
    visible: 'No meals yet today.'
    timeout: 10000
- takeScreenshot: food-phone
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-food, EMAIL: '${EMAIL}' }
