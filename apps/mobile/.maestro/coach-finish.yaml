# Single active logger: the coach takes over the client's workout, ticks a set and finishes the session from the
# website. The phone keeps the workout on screen read only under "Your coach is logging this session" and shows the
# coach's set live. When the coach finishes, the phone goes straight to the sticker reveal, which says "Your coach
# logged this session", then to the summary with the "Logged by coach" pill; Today shows it done, revealed once.
# Run via `pnpm --filter mobile e2e` (starts the helper bridge and passes HELPER_URL).
appId: app.caltracker.client
env:
  EMAIL: client@demo.local
  PASSWORD: demo-password-123
---
- runScript:
    file: helpers/call.js
    env: { ACTION: assign-today, EMAIL: '${EMAIL}' }
- launchApp:
    clearState: true
    permissions: { notifications: allow }
- runFlow:
    file: helpers/sign-in.yaml
    env: { EMAIL: '${EMAIL}', PASSWORD: '${PASSWORD}' }
- runFlow:
    file: helpers/start-first-section.yaml
    env: { NAME: 'E2E Log' }
- tapOn:
    id: tick-0-0-0
- runScript:
    file: helpers/call.js
    env: { ACTION: coach-take-over, EMAIL: '${EMAIL}' }
- extendedWaitUntil:
    visible: 'Your coach is logging this session'
    timeout: 20000
# The pages stay, read only.
- assertVisible:
    id: tick-0-0-0
    text: 'checkbox, checked'
- assertNotVisible:
    id: page-done
# ---- The coach ticks set 2: it shows on the phone live ----
- runScript:
    file: helpers/call.js
    env: { ACTION: coach-log-set, EMAIL: '${EMAIL}' }
- extendedWaitUntil:
    visible:
      id: tick-0-0-1
      text: 'checkbox, checked'
    timeout: 5000
- assertVisible:
    id: actual-reps-0-0-1
    text: '10'
# ---- The coach finishes: the phone goes straight to the sticker reveal, without any tap ----
- runScript:
    file: helpers/call.js
    env: { ACTION: coach-finish, EMAIL: '${EMAIL}' }
- extendedWaitUntil:
    visible:
      id: reveal-coach-line
    timeout: 20000
- assertVisible:
    id: reveal-coach-line
    text: 'Your coach logged this session'
- extendedWaitUntil:
    visible:
      id: reveal-card
    timeout: 15000
- takeScreenshot: coach-logging-reveal
- runFlow: helpers/reveal-through.yaml
# Then the summary, with the "Logged by coach" pill.
- extendedWaitUntil:
    visible: '3 sets completed'
    timeout: 20000
- assertVisible:
    id: logged-by-coach
- assertVisible: 'Logged by coach'
- takeScreenshot: coach-logging-summary
- tapOn:
    id: summary-done
# Today shows it done, and doesn't reveal it a second time.
- extendedWaitUntil:
    visible: 'Done ✓.*'
    timeout: 20000
- assertNotVisible:
    id: reveal-screen
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-logs, EMAIL: '${EMAIL}' }
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-workouts, EMAIL: '-' }
