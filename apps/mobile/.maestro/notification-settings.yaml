# Settings (gear on Today) -> Notifications: the three groups on Settings say On / "2 of 3 on"; a switch stays off
# after leaving and coming back; Back from Notifications returns to Settings (one step, not Today); a new quiet-hours
# start is kept. The demo client starts with default settings (notification_prefs has no row).
# Run via `pnpm --filter mobile e2e .maestro/notification-settings.yaml`.
appId: app.caltracker.client
env:
  EMAIL: client@demo.local
  PASSWORD: demo-password-123
---
- launchApp:
    clearState: true
    permissions: { notifications: allow }
- runFlow:
    file: helpers/sign-in.yaml
    env: { EMAIL: '${EMAIL}', PASSWORD: '${PASSWORD}' }
- tapOn:
    id: today-settings
- extendedWaitUntil:
    visible:
      id: settings-notifications
    timeout: 10000
# iOS may not have asked yet: "Turn on notifications" asks, and the groups come back on from "Paused".
- runFlow:
    when:
      visible:
        id: settings-notifications-open
    commands:
      - tapOn:
          id: settings-notifications-open
      - tapOn:
          text: Allow
          optional: true
- assertNotVisible:
    id: settings-notifications-open
- assertVisible: 'Workouts & reminders.*'
- assertVisible: 'Messages from .*'
- assertVisible:
    id: settings-notifications-coach
    text: 'Messages from .*, On'
- assertNotVisible:
    id: settings-notifications-open
- tapOn:
    id: settings-notifications-coach
- assertVisible: 'Notifications'
- assertNotVisible:
    id: notifications-off-banner
# Meal comments don't exist yet: no switch for them.
- assertNotVisible: 'Comments on your meals'
- tapOn:
    id: notif-switch-message
# Back goes one step: to Settings, where the group now says 2 of 3 on.
- tapOn:
    id: notifications-settings-back
- assertVisible:
    id: settings-notifications-coach
    text: 'Messages from .*, 2 of 3 on'
- tapOn:
    id: settings-notifications-coach
- assertVisible:
    id: notif-switch-message
    checked: false
- scrollUntilVisible:
    element:
      id: notif-time-quietStart
    direction: DOWN
- tapOn:
    id: notif-time-quietStart
- scrollUntilVisible:
    element: '11:00 PM'
    direction: DOWN
- tapOn: '11:00 PM'
- scrollUntilVisible:
    element:
      id: notifications-settings-back
    direction: UP
- tapOn:
    id: notifications-settings-back
# Put the defaults back for the next run: the message switch first (top), then the quiet-hours start.
- tapOn:
    id: settings-notifications
# The switches work once the server's copy is in ("Loading your settings…" gone).
- extendedWaitUntil:
    notVisible:
      id: notifications-prefs-note
    timeout: 10000
- tapOn:
    id: notif-switch-message
- assertVisible:
    id: notif-switch-message
    checked: true
- scrollUntilVisible:
    element:
      id: notif-time-quietStart
    direction: DOWN
- assertVisible:
    id: notif-time-quietStart
    text: '.*11:00 PM.*'
- tapOn:
    id: notif-time-quietStart
- scrollUntilVisible:
    element: '10:00 PM'
    direction: UP
- tapOn: '10:00 PM'
- waitForAnimationToEnd
- assertVisible:
    id: notif-time-quietStart
    text: '.*10:00 PM.*'
- scrollUntilVisible:
    element:
      id: notifications-settings-back
    direction: UP
- tapOn:
    id: notifications-settings-back
- assertVisible:
    id: settings-notifications-coach
    text: 'Messages from .*, On'
