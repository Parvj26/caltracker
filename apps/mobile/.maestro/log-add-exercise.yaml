# Smarter + Exercise search: start an unplanned workout, tap + Exercise, type the shorthand "db incline" and see
# an incline dumbbell exercise ("Incline Dumbbell…" or "Dumbbell Incline…") as the first result; tapping it adds it to the log. Needs the exercise library imported (pnpm import:exercises).
# Run via `pnpm --filter mobile e2e` (starts the helper bridge and passes HELPER_URL).
appId: app.caltracker.client
env:
  EMAIL: client@demo.local
  PASSWORD: demo-password-123
---
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-logs, EMAIL: '${EMAIL}' }
- launchApp:
    clearState: true
- runFlow:
    file: helpers/sign-in.yaml
    env: { EMAIL: '${EMAIL}', PASSWORD: '${PASSWORD}' }
- tapOn:
    id: tab-workouts
# The button sits below the week, the day's card and Coming up, so it may be off screen.
- scrollUntilVisible:
    element:
      id: log-unplanned
    direction: DOWN
    timeout: 10000
- tapOn:
    id: log-unplanned
- assertVisible:
    id: unplanned-name
- tapOn:
    id: unplanned-name
- eraseText
- inputText: 'Run'
- tapOn:
    id: unplanned-start
- tapOn:
    text: Allow
    optional: true
- extendedWaitUntil:
    visible:
      id: add-exercise
    timeout: 20000
- tapOn:
    id: add-exercise
- tapOn:
    id: exercise-search
- inputText: 'db incline'
- extendedWaitUntil:
    visible:
      id: exercise-result-0
    timeout: 20000
- assertVisible:
    id: exercise-result-0
    text: '(Incline Dumbbell|Dumbbell Incline).*'
- tapOn:
    id: exercise-result-0
# The new exercise's page opens straight away.
- extendedWaitUntil:
    visible:
      id: page-done
    timeout: 10000
- assertVisible:
    id: exercise-name-0
    text: '(Incline Dumbbell|Dumbbell Incline).*'
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-logs, EMAIL: '${EMAIL}' }
