# The section pages on a mixed workout ("E2E Mixed", no sections, so one section named after the workout):
#   page 1 Barbell Squat: a warm-up row (W, 20 kg × 10) then 2 × 8 @ 60 kg;
#   page 2 superset Pullups (A1) + Pushups (A2), 2 rounds, scrolled round by round;
#   page 3 Dumbbell Bicep Curl 2 × 12 @ 10 kg, the second followed by two drops to failure (F).
# A weight typed on set 1 carries into set 2; a ticked set's numbers stay editable and it stays ticked; ✓ again
# unticks; Mark all rounds; dots move between pages; the F tag explains itself; Done on the last page
# opens the finish sheet, which says what isn't ticked; Keep going returns to the page.
# Run via `pnpm --filter mobile e2e` (starts the helper bridge and passes HELPER_URL).
appId: app.caltracker.client
env:
  EMAIL: client@demo.local
  PASSWORD: demo-password-123
---
- runScript:
    file: helpers/call.js
    env: { ACTION: assign-today-mixed, EMAIL: '${EMAIL}' }
- launchApp:
    clearState: true
    permissions: { notifications: allow }
- runFlow:
    file: helpers/sign-in.yaml
    env: { EMAIL: '${EMAIL}', PASSWORD: '${PASSWORD}' }
- runFlow:
    file: helpers/start-first-section.yaml
    env: { NAME: 'E2E Mixed' }

# ---- Page 1: warm-up row, a typed weight that carries forward, editing a ticked set ----
- assertVisible:
    id: exercise-name-0
    text: 'Barbell Squat'
- assertVisible:
    id: tag-0-0-0
    text: 'Warm-up 1. What does W mean.*'
- tapOn:
    id: tick-0-0-0
# 20 kg in this client's pounds, saved from the pre-fill when ticked.
- assertVisible:
    id: actual-weight-0-0-0
    text: '44'
- tapOn:
    id: actual-weight-0-0-1
- waitForAnimationToEnd
- inputText: '140'
- tapOn:
    id: tick-0-0-1
- tapOn:
    id: tick-0-0-2
# Set 2 took the 140 lb typed on set 1 (the coach planned the same weight for both).
- assertVisible:
    id: actual-weight-0-0-2
    text: '140'
- assertVisible:
    id: actual-reps-0-0-2
    text: '8'
# Change a ticked set: it stays ticked with the new number.
- tapOn:
    id: actual-reps-0-0-2
- waitForAnimationToEnd
- eraseText
- inputText: '6'
# Done typing (Enter ends editing; the simulator has no on-screen keypad, so its Done typing bar can't show).
- pressKey: Enter
- assertVisible:
    id: actual-reps-0-0-2
    text: '6'
- assertVisible:
    id: tick-0-0-2
    text: 'checkbox, checked'
# ✓ again unticks it; the typed 6 stays.
- tapOn:
    id: tick-0-0-2
- assertVisible:
    id: tick-0-0-2
    text: 'checkbox, unchecked'
- tapOn:
    id: tick-0-0-2
- assertVisible:
    id: tick-0-0-2
    text: 'checkbox, checked'
- takeScreenshot: flow-01-straight
- tapOn:
    id: page-done

# ---- Page 2: superset round by round ----
- extendedWaitUntil:
    visible:
      id: superset-heading-1
      text: 'Superset 1 · Round 1 of 2'
    timeout: 10000
- assertVisible:
    id: exercise-name-1-0
    text: 'A1 · Pullups'
- assertVisible:
    id: round-rest-1-1
    text: 'Rest 1:00 after the round'
- tapOn:
    id: tick-1-0-0
- tapOn:
    id: tick-1-1-0
- extendedWaitUntil:
    visible:
      id: superset-heading-1
      text: 'Superset 1 · Round 2 of 2'
    timeout: 5000
- runFlow:
    file: helpers/mark-all.yaml
    env: { PAGE: '1' }
- assertVisible:
    id: tick-1-1-1
    text: 'checkbox, checked'
- takeScreenshot: flow-02-superset
# A dot jumps to its page, and back.
- tapOn:
    id: dot-0
- extendedWaitUntil:
    visible:
      id: exercise-name-0
    timeout: 5000
- tapOn:
    id: dot-2
- extendedWaitUntil:
    visible:
      id: exercise-name-2
      text: 'Dumbbell Bicep Curl'
    timeout: 5000

# ---- Page 3: drops to failure ----
- assertVisible:
    id: tag-2-0-2
    text: 'Drop set to failure. What does F mean.*'
- tapOn:
    id: tag-2-0-2
- extendedWaitUntil:
    visible:
      id: tag-info
    timeout: 5000
- assertVisible: 'F · To failure'
- tapOn:
    id: tag-info-ok
- tapOn:
    id: tick-2-0-0
- tapOn:
    id: page-done
# The last page of the last section: the finish sheet, which says what isn't ticked.
- extendedWaitUntil:
    visible:
      id: finish-sheet
    timeout: 10000
- assertVisible:
    id: finish-count
    text: '8 of 11 sets done. 3 sets of Dumbbell Bicep Curl aren’t ticked; they’ll be saved as not done.'
- tapOn:
    id: finish-keep-going
- extendedWaitUntil:
    visible:
      id: exercise-name-2
    timeout: 5000
# Back to the superset by its dot (it is still scrolled to where Mark all rounds was).
- tapOn:
    id: dot-1
- scrollUntilVisible:
    element:
      id: superset-heading-1
    direction: UP
- tapOn:
    id: dot-2
- extendedWaitUntil:
    visible:
      id: exercise-name-2
    timeout: 5000
- tapOn:
    id: page-done
- runFlow: helpers/finish-from-sheet.yaml
- extendedWaitUntil:
    visible: '8 sets completed'
    timeout: 10000
- assertVisible: 'E2E Mixed'
- tapOn:
    id: summary-done
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-logs, EMAIL: '${EMAIL}' }
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-workouts, EMAIL: '-' }
