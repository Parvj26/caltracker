# Invited client signs up, confirms email, signs in and lands in the coach's workspace.
# Run via `pnpm --filter mobile e2e` (starts the helper bridge and passes HELPER_URL).
appId: app.caltracker.client
env:
  EMAIL: e2e-client@x.com
  PASSWORD: e2e-password-123
---
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup, EMAIL: '${EMAIL}' }
- runScript:
    file: helpers/call.js
    env: { ACTION: invite, EMAIL: '${EMAIL}', NAME: 'E2E Client' }
- launchApp:
    clearState: true
- tapOn:
    id: go-sign-up
- tapOn:
    id: name-input
- inputText: E2E
- tapOn:
    id: last-name-input
- inputText: Client
- tapOn:
    id: email-input
- inputText: ${EMAIL}
- tapOn:
    id: password-input
- inputText: ${PASSWORD}
- runFlow: helpers/submit.yaml
# iOS may offer to save the password; dismiss it if shown.
- tapOn:
    text: Not Now
    optional: true
- assertVisible: 'We sent a link to ${EMAIL}. Tap it, then come back and sign in.'
- runScript:
    file: helpers/call.js
    env: { ACTION: confirm, EMAIL: '${EMAIL}' }
- tapOn:
    id: go-sign-in
- tapOn:
    id: email-input
- inputText: ${EMAIL}
- tapOn:
    id: password-input
- inputText: ${PASSWORD}
- runFlow: helpers/submit.yaml
# iOS may offer to save the password; dismiss it if shown.
- tapOn:
    text: Not Now
    optional: true
- assertVisible:
    id: today-greeting
# A brand-new client has no workouts yet, so Today shows the first-time welcome.
- extendedWaitUntil:
    visible: 'Your first workout is coming!'
    timeout: 20000
# kg/lb lives in Settings (gear on Today), with Sign out at the bottom.
- tapOn:
    id: today-settings
- assertVisible:
    id: units-kg
- assertVisible:
    id: units-lb
- tapOn:
    id: settings-close
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup, EMAIL: '${EMAIL}' }
