# The client logs today's planned workout: Start, Done on set 1 (the rest panel opens), skip the rest, Done on the
# other two, Finish. The summary shows the sets and the volume; Today then shows Done ✓, and its View button
# opens the same summary again.
# Run via `pnpm --filter mobile e2e` (starts the helper bridge and passes HELPER_URL).
appId: app.caltracker.client
env:
  EMAIL: client@demo.local
  PASSWORD: demo-password-123
---
- runScript:
    file: helpers/call.js
    env: { ACTION: assign-today, EMAIL: '${EMAIL}' }
- launchApp:
    clearState: true
    # Granted up front: tapping the system's Allow could land on the page underneath as the alert closes.
    permissions: { notifications: allow }
- runFlow:
    file: helpers/sign-in.yaml
    env: { EMAIL: '${EMAIL}', PASSWORD: '${PASSWORD}' }
- extendedWaitUntil:
    visible: 'E2E Log'
    timeout: 20000
- tapOn: 'Start'
- extendedWaitUntil:
    visible:
      id: done-0
    timeout: 20000
- assertVisible: 'Set 1 of 3'
# How to (on the photo) opens the info sheet: name, instructions, a Close button.
- tapOn:
    id: how-to-0
- extendedWaitUntil:
    visible:
      id: exercise-sheet-name
    timeout: 10000
- assertVisible:
    id: exercise-sheet-name
    text: 'Barbell Squat'
- assertVisible: 'Instructions'
- assertVisible: '1\..*'
- takeScreenshot: exercise-sheet
- tapOn:
    id: exercise-sheet-close
- assertNotVisible:
    id: exercise-sheet-name
# Done says what happens next; set 1 starts the 1:30 rest, whose panel says what comes after it.
- assertVisible:
    id: done-0
    text: 'Done · start rest 1:30'
- tapOn:
    id: done-0
- extendedWaitUntil:
    visible:
      id: rest-panel
    timeout: 10000
- assertVisible:
    id: rest-next
    text: 'Next: Barbell Squat · set 2 of 3 · 132 lb × 8'
- tapOn:
    id: rest-skip
- assertNotVisible:
    id: rest-panel
- assertVisible: 'Set 2 of 3'
- tapOn:
    id: done-0
- tapOn:
    id: rest-skip
- assertVisible:
    id: done-0
    text: 'Done · last set'
- tapOn:
    id: done-0
# The last set starts no rest; the page says the exercise is finished.
- extendedWaitUntil:
    visible:
      id: all-done-0
    timeout: 10000
- assertNotVisible:
    id: rest-panel
- tapOn:
    id: finish-workout
# Every set was ticked, so there is no "sets not done" question.
- extendedWaitUntil:
    visible: '3 sets completed'
    timeout: 10000
- assertVisible: 'E2E Log'
# 3 × 8 × 60 kg = 1,440 kg, shown in this client's pounds.
- assertVisible:
    id: summary-volume
- assertVisible: '3,175 lb lifted'
- assertVisible: 'Coach comments'
- tapOn:
    id: summary-done
- extendedWaitUntil:
    visible: 'Done ✓.*'
    timeout: 20000
- assertNotVisible: 'Start'
# Later, from Today: View opens the summary again.
- tapOn: 'View'
- extendedWaitUntil:
    visible: '3 sets completed'
    timeout: 20000
- tapOn:
    id: summary-done
- assertVisible: 'Done ✓.*'
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-logs, EMAIL: '${EMAIL}' }
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-workouts, EMAIL: '-' }
