# The client logs today's planned workout: Start, tick a set (the rest timer opens), skip the rest, tick the
# other two, Finish. The summary shows the sets and the volume; Today then shows Done ✓, and its View button
# opens the same summary again.
# Run via `pnpm --filter mobile e2e` (starts the helper bridge and passes HELPER_URL).
appId: app.caltracker.client
env:
  EMAIL: client@demo.local
  PASSWORD: demo-password-123
---
- runScript:
    file: helpers/call.js
    env: { ACTION: assign-today, EMAIL: '${EMAIL}' }
- launchApp:
    clearState: true
- runFlow:
    file: helpers/sign-in.yaml
    env: { EMAIL: '${EMAIL}', PASSWORD: '${PASSWORD}' }
- extendedWaitUntil:
    visible: 'E2E Log'
    timeout: 20000
- tapOn: 'Start'
# The first workout asks to allow notifications (rest timer and reminder).
- tapOn:
    text: Allow
    optional: true
- extendedWaitUntil:
    visible:
      id: tick-0-0
    timeout: 20000
# The exercise name opens its info sheet: name, instructions, a Close button.
- tapOn:
    id: exercise-name-0
- extendedWaitUntil:
    visible:
      id: exercise-sheet-name
    timeout: 10000
- assertVisible: 'Barbell Squat'
- assertVisible: 'Instructions'
- assertVisible: '1\..*'
- takeScreenshot: exercise-sheet
- tapOn:
    id: exercise-sheet-close
- assertNotVisible:
    id: exercise-sheet-name
- tapOn:
    id: tick-0-0
- assertVisible:
    id: rest-sheet
- tapOn:
    id: rest-skip
- assertNotVisible:
    id: rest-sheet
- tapOn:
    id: tick-0-1
- tapOn:
    id: rest-skip
- tapOn:
    id: tick-0-2
- tapOn:
    id: rest-skip
- tapOn:
    id: log-menu
- tapOn:
    id: finish-button
# Every set was ticked, so there is no "sets not done" question.
- extendedWaitUntil:
    visible: '3 sets completed'
    timeout: 10000
- assertVisible: 'E2E Log'
# 3 × 8 × 60 kg = 1,440 kg, shown in this client's pounds.
- assertVisible:
    id: summary-volume
- assertVisible: '3,175 lb lifted'
- assertVisible: 'Coach comments'
- tapOn:
    id: summary-done
- extendedWaitUntil:
    visible: 'Done ✓.*'
    timeout: 20000
- assertNotVisible: 'Start'
# Later, from Today: View opens the summary again.
- tapOn: 'View'
- extendedWaitUntil:
    visible: '3 sets completed'
    timeout: 20000
- tapOn:
    id: summary-done
- assertVisible: 'Done ✓.*'
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-logs, EMAIL: '${EMAIL}' }
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-workouts, EMAIL: '-' }
