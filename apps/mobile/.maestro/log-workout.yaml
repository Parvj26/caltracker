# The client logs today's planned workout ("E2E Log", Barbell Squat 3 × 8 @ 60 kg, 1:30 rests): Start opens the
# workout overview, Start workout the section's start page, Start section the exercise. The page shows the demo,
# the coach's rest as text only (no rest timer), and a set table; ✓ on each set, Done, then the Finish workout?
# sheet (How did it feel?, a note), the sticker reveal and the summary. Today then shows Done ✓, and View opens
# the same summary again.
# Run via `pnpm --filter mobile e2e` (starts the helper bridge and passes HELPER_URL).
appId: app.caltracker.client
env:
  EMAIL: client@demo.local
  PASSWORD: demo-password-123
---
- runScript:
    file: helpers/call.js
    env: { ACTION: assign-today, EMAIL: '${EMAIL}' }
- launchApp:
    clearState: true
    # Granted up front: tapping the system's Allow could land on the page underneath as the alert closes.
    permissions: { notifications: allow }
- runFlow:
    file: helpers/sign-in.yaml
    env: { EMAIL: '${EMAIL}', PASSWORD: '${PASSWORD}' }
- extendedWaitUntil:
    visible: 'E2E Log'
    timeout: 20000
- tapOn: 'Start'
# ---- Overview, then the (unnamed) section's start page ----
- extendedWaitUntil:
    visible:
      id: workout-overview
    timeout: 20000
- assertVisible:
    id: overview-name
    text: 'E2E Log'
- assertVisible:
    id: start-workout
    text: 'Start workout'
- tapOn:
    id: start-workout
- extendedWaitUntil:
    visible:
      id: section-title
      text: 'E2E Log'
    timeout: 10000
- assertVisible:
    id: section-count
    text: '1 exercise'
# The list: name, the coach's targets in one line, ×3.
- assertVisible: 'Barbell Squat, 3 sets: 132 lb × 8, 132 lb × 8, 132 lb × 8'
- tapOn:
    id: start-section
# ---- The exercise page ----
- extendedWaitUntil:
    visible:
      id: exercise-name-0
      text: 'Barbell Squat'
    timeout: 10000
- assertVisible:
    id: rest-line-0-0
    text: 'Rest 1:30'
- assertNotVisible:
    id: rest-panel
# Tapping the demo opens the exercise sheet: name, instructions, Close.
- tapOn:
    id: demo-0-0
- extendedWaitUntil:
    visible:
      id: exercise-sheet-name
    timeout: 10000
- assertVisible:
    id: exercise-sheet-name
    text: 'Barbell Squat'
- assertVisible: 'Instructions'
- takeScreenshot: exercise-sheet
- tapOn:
    id: exercise-sheet-close
- assertNotVisible:
    id: exercise-sheet-name
# ✓ just completes the set: no rest panel, no countdown.
- tapOn:
    id: tick-0-0-0
- assertVisible:
    id: tick-0-0-0
    text: 'checkbox, checked'
- assertNotVisible:
    id: rest-panel
- tapOn:
    id: tick-0-0-1
- tapOn:
    id: tick-0-0-2
- assertVisible:
    id: tick-0-0-2
    text: 'checkbox, checked'
# The only section's last page: Done opens the finish sheet.
- tapOn:
    id: page-done
- extendedWaitUntil:
    visible:
      id: finish-sheet
    timeout: 10000
- assertVisible:
    id: finish-count
    text: '3 of 3 sets done.'
- tapOn:
    id: feel-Good
- tapOn:
    id: finish-note
- inputText: 'Felt strong'
- hideKeyboard
# Leaving the box saves the note; typing on afterwards is never overwritten by that save.
- tapOn:
    id: finish-note
- inputText: ' today'
- hideKeyboard
- assertVisible:
    id: finish-note
    text: 'Felt strong today'
# Keep going keeps the draft: the feeling and the note are back when the sheet opens again.
- tapOn:
    id: finish-keep-going
- extendedWaitUntil:
    notVisible:
      id: finish-sheet
    timeout: 5000
- tapOn:
    id: page-done
- extendedWaitUntil:
    visible:
      id: finish-note
      text: 'Felt strong today'
    timeout: 10000
- runFlow: helpers/finish-from-sheet.yaml
- extendedWaitUntil:
    visible: '3 sets completed'
    timeout: 10000
- assertVisible: 'E2E Log'
# 3 × 8 × 60 kg = 1,440 kg, shown in this client's pounds.
- assertVisible:
    id: summary-volume
- assertVisible: '3,175 lb lifted'
- assertVisible: 'Coach comments'
- assertNotVisible:
    id: summary-changes
- tapOn:
    id: summary-done
- extendedWaitUntil:
    visible: 'Done ✓.*'
    timeout: 20000
- assertNotVisible: 'Start'
# The feeling and the note were saved with the workout (read back from the server here).
- runScript:
    file: helpers/call.js
    env: { ACTION: log-notes, EMAIL: '${EMAIL}' }
- assertTrue: '${output.call == "Felt: Good | Felt strong today"}'
# Later, from Today: View opens the summary again.
- tapOn: 'View'
- extendedWaitUntil:
    visible: '3 sets completed'
    timeout: 20000
- tapOn:
    id: summary-done
- assertVisible: 'Done ✓.*'
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-logs, EMAIL: '${EMAIL}' }
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-workouts, EMAIL: '-' }
