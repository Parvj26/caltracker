# The client logs today's planned workout ("E2E Log", Barbell Squat 3 × 8 @ 60 kg, 1:30 rests): Start goes straight
# to the first set. The page shows the demo thumbnail, the coach's rest as text only (no rest timer), and a set table;
# ✓ on each set, Finish workout, then the Finish workout? sheet (How did it feel?, a note), the sticker reveal and the
# summary. Today then shows the done row, which opens the same summary again.
# Run via `pnpm --filter mobile e2e` (starts the helper bridge and passes HELPER_URL).
appId: app.caltracker.client
env:
  EMAIL: client@demo.local
  PASSWORD: demo-password-123
---
- runScript:
    file: helpers/call.js
    env: { ACTION: assign-today, EMAIL: '${EMAIL}' }
- launchApp:
    clearState: true
    # Granted up front: tapping the system's Allow could land on the page underneath as the alert closes.
    permissions: { notifications: allow }
- runFlow:
    file: helpers/sign-in.yaml
    env: { EMAIL: '${EMAIL}', PASSWORD: '${PASSWORD}' }
- extendedWaitUntil:
    visible: 'E2E Log'
    timeout: 20000
# Today's card: exercises, sets (every tickable row) and time.
- assertVisible:
    id: 'today-meta-.*'
    text: '1 exercise · 3 sets · .*'
- tapOn: 'Start workout'
# Start goes straight to the first set: no overview, no Start section.
# ---- The exercise page ----
- extendedWaitUntil:
    visible:
      id: exercise-name-0
      text: 'Barbell Squat'
    timeout: 10000
- assertVisible:
    id: rest-line-0-0
    text: 'Rest 1:30 between sets'
- assertVisible:
    id: pages-sections
    text: 'Exercise 1 of 1 · All exercises ▾'
- assertVisible: 'Swap exercise'
# No Finish (or Next) before a set is ticked.
- assertNotVisible:
    id: page-done
- assertNotVisible:
    id: rest-panel
# Tapping the demo opens the exercise sheet: name, instructions, Close.
- tapOn:
    id: demo-0-0
- extendedWaitUntil:
    visible:
      id: exercise-sheet-name
    timeout: 10000
- assertVisible:
    id: exercise-sheet-name
    text: 'Barbell Squat'
- assertVisible: 'Instructions'
- takeScreenshot: exercise-sheet
- tapOn:
    id: exercise-sheet-close
- assertNotVisible:
    id: exercise-sheet-name
# ✓ just completes the set: no rest panel, no countdown.
- tapOn:
    id: tick-0-0-0
- assertVisible:
    id: tick-0-0-0
    text: 'checkbox, checked'
- assertNotVisible:
    id: rest-panel
- tapOn:
    id: tick-0-0-1
- tapOn:
    id: tick-0-0-2
- assertVisible:
    id: tick-0-0-2
    text: 'checkbox, checked'
# The last page: Finish workout opens the finish sheet.
- assertVisible:
    id: page-done
    text: 'Finish workout'
- tapOn:
    id: page-done
- extendedWaitUntil:
    visible:
      id: finish-sheet
    timeout: 10000
- assertVisible:
    id: finish-count
    text: '3 of 3 sets done.'
- tapOn:
    id: feel-Good
- tapOn:
    id: finish-note
- inputText: 'Felt strong'
- hideKeyboard
# Leaving the box saves the note; typing on afterwards is never overwritten by that save.
- tapOn:
    id: finish-note
- inputText: ' today'
- hideKeyboard
- assertVisible:
    id: finish-note
    text: 'Felt strong today'
# Keep going keeps the draft: the feeling and the note are back when the sheet opens again.
- tapOn:
    id: finish-keep-going
- extendedWaitUntil:
    notVisible:
      id: finish-sheet
    timeout: 5000
- tapOn:
    id: page-done
- extendedWaitUntil:
    visible:
      id: finish-note
      text: 'Felt strong today'
    timeout: 10000
- runFlow: helpers/finish-from-sheet.yaml
# 3 × 8 × 60 kg = 1,440 kg, shown in this client's pounds.
- extendedWaitUntil:
    visible:
      id: summary-sets
      text: '3 of 3 sets · .* · 3,175 lb lifted'
    timeout: 10000
- assertVisible: 'E2E Log'
- assertVisible:
    id: summary-effort
    text: 'You told .*: Good · “Felt strong today”'
- assertVisible: 'Your progress'
- assertNotVisible:
    id: summary-changes
- tapOn:
    id: summary-done
# Today: the card shrinks to a done row.
- extendedWaitUntil:
    visible: 'E2E Log done'
    timeout: 20000
- assertVisible: '3 of 3 sets.*'
- assertNotVisible: 'Start workout'
# The feeling and the note were saved with the workout (read back from the server here).
- runScript:
    file: helpers/call.js
    env: { ACTION: log-notes, EMAIL: '${EMAIL}' }
- assertTrue: '${output.call == "Felt: Good | Felt strong today"}'
# Later, from Today: the done row opens the summary again; Done comes back to Today.
- tapOn:
    id: 'today-done-.*'
- extendedWaitUntil:
    visible:
      id: summary-sets
      text: '3 of 3 sets.*'
    timeout: 20000
- tapOn:
    id: summary-done
- assertVisible: 'E2E Log done'
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-logs, EMAIL: '${EMAIL}' }
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-workouts, EMAIL: '-' }
