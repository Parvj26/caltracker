# "Forgot password?" on sign-in: carries the typed email over, sends the reset link and always shows the same
# neutral answer, whether or not the email has an account.
appId: app.caltracker.client
env:
  EMAIL: nobody-reset@x.com
---
- launchApp:
    clearState: true
- tapOn:
    id: email-input
- inputText: ${EMAIL}
- hideKeyboard
- tapOn:
    id: go-forgot-password
- assertVisible: 'Reset your password'
- assertVisible:
    id: reset-email-input
    text: ${EMAIL}
- hideKeyboard
- tapOn:
    id: reset-submit
- extendedWaitUntil:
    visible:
      id: reset-sent
    timeout: 15000
- assertVisible: "If that email has an account, we've sent a link. It can take a minute to arrive."
- tapOn:
    id: go-sign-in
- assertVisible:
    id: go-forgot-password
