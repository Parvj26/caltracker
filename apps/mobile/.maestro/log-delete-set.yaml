# Deleting a set while logging (in Edit sets), two ways: the set's ⋯ button then Remove set, and swiping the row left then Delete.
# "E2E Log" starts with 3 sets of Barbell Squat.
# Run via `pnpm --filter mobile e2e` (starts the helper bridge and passes HELPER_URL).
appId: app.caltracker.client
env:
  EMAIL: client@demo.local
  PASSWORD: demo-password-123
---
- runScript:
    file: helpers/call.js
    env: { ACTION: assign-today, EMAIL: '${EMAIL}' }
- launchApp:
    clearState: true
    # Granted up front: tapping the system's Allow could land on the page underneath as the alert closes.
    permissions: { notifications: allow }
- runFlow:
    file: helpers/sign-in.yaml
    env: { EMAIL: '${EMAIL}', PASSWORD: '${PASSWORD}' }
- extendedWaitUntil:
    visible: 'E2E Log'
    timeout: 20000
- tapOn: 'Start'
- extendedWaitUntil:
    visible:
      id: edit-sets-0
    timeout: 20000
# The set rows live in Edit sets.
- tapOn:
    id: edit-sets-0
- extendedWaitUntil:
    visible:
      id: set-0-2
    timeout: 10000
# ⋯ button, then Remove set: three sets become two.
- tapOn:
    id: set-more-0-1
- tapOn:
    id: menu-remove-set
- assertNotVisible:
    id: set-0-2
- assertVisible:
    id: set-0-1
# Let the menu finish closing over the sheet first.
- waitForAnimationToEnd
# Swipe the second row left, tap its Delete: one set left.
# Start on the row's caption line in the Edit sets sheet, clear of the value boxes and the tick button.
- swipe:
    start: 62%,39%
    end: 15%,39%
- assertVisible:
    id: set-delete-0-1
- waitForAnimationToEnd
- takeScreenshot: swipe-delete
- tapOn:
    id: set-delete-0-1
- assertNotVisible:
    id: set-0-1
- assertVisible:
    id: set-0-0
- tapOn:
    id: edit-sets-close
# Tidy up.
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-logs, EMAIL: '${EMAIL}' }
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-workouts, EMAIL: '-' }
