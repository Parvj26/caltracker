# Changing the sets while logging ("E2E Log", 3 sets of Barbell Squat): swipe a row left and tap Delete, + Add set,
# and the ••• menu's Add a drop set, whose D tag explains itself.
# Run via `pnpm --filter mobile e2e` (starts the helper bridge and passes HELPER_URL).
appId: app.caltracker.client
env:
  EMAIL: client@demo.local
  PASSWORD: demo-password-123
---
- runScript:
    file: helpers/call.js
    env: { ACTION: assign-today, EMAIL: '${EMAIL}' }
- launchApp:
    clearState: true
    permissions: { notifications: allow }
- runFlow:
    file: helpers/sign-in.yaml
    env: { EMAIL: '${EMAIL}', PASSWORD: '${PASSWORD}' }
- runFlow:
    file: helpers/start-first-section.yaml
    env: { NAME: 'E2E Log' }
- assertVisible:
    id: set-0-0-2
# Swipe the second row left from its set number, then Delete: three sets become two.
- swipe:
    from:
      id: tag-0-0-1
    direction: LEFT
- extendedWaitUntil:
    visible:
      id: set-delete-0-0-1
    timeout: 5000
- takeScreenshot: swipe-delete
- tapOn:
    id: set-delete-0-0-1
- extendedWaitUntil:
    notVisible:
      id: set-0-0-2
    timeout: 5000
- assertVisible:
    id: set-0-0-1
# + Add set: three again.
- tapOn:
    id: add-set-0-0
- extendedWaitUntil:
    visible:
      id: set-0-0-2
    timeout: 5000
# ••• → Add a drop set: a D row after the last set.
- tapOn:
    id: more-0-0
- tapOn:
    id: menu-add-drop
- extendedWaitUntil:
    visible:
      id: tag-0-0-3
      text: '.*What does D mean.*'
    timeout: 5000
- tapOn:
    id: tag-0-0-3
- extendedWaitUntil:
    visible:
      id: tag-info
    timeout: 5000
- assertVisible: 'D · Drop set'
- tapOn:
    id: tag-info-ok
# Tidy up.
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-logs, EMAIL: '${EMAIL}' }
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-workouts, EMAIL: '-' }
