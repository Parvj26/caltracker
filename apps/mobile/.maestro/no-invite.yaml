# Client without a coach sees the waiting screen, then gets linked after the coach invites them.
# Sign-up is invite only now, so the helper makes the account (as if it predates that).
appId: app.caltracker.client
env:
  EMAIL: nobody@x.com
  PASSWORD: e2e-password-123
---
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup, EMAIL: '${EMAIL}' }
- runScript:
    file: helpers/call.js
    env: { ACTION: create-user, EMAIL: '${EMAIL}', NAME: 'Nobody Here' }
- launchApp:
    clearState: true
- assertVisible: 'New here? Ask your coach for an invite.'
- assertNotVisible: 'Create an account'
- tapOn:
    id: email-input
- inputText: ${EMAIL}
- tapOn:
    id: password-input
- inputText: ${PASSWORD}
- runFlow: helpers/submit.yaml
# iOS may offer to save the password; dismiss it if shown.
- tapOn:
    text: Not Now
    optional: true
- assertVisible: 'Ask your coach for an invite'
- assertVisible: 'Sign out'
- runScript:
    file: helpers/call.js
    env: { ACTION: invite, EMAIL: '${EMAIL}', NAME: 'Nobody Here' }
- tapOn: 'Check again'
- assertVisible:
    id: today-greeting
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup, EMAIL: '${EMAIL}' }
