# Apple Health import end to end on the iOS Simulator (iPhone 18 Pro: the iOS prompt and Health's confirm sheets are
# tapped by screen point). Install the app fresh first (uninstall + install), so iOS asks again:
#   xcrun simctl uninstall booted app.caltracker.client && xcrun simctl install booted <CalTracker.app>
# In the Health app: clear weights, add 69.0 kg from 14 months ago and 71.2 kg now. In CalTracker: connect from
# Metrics; the iOS prompt shows only after Continue, read access only, the five switched-on types; allow all recorded
# data. Only 71.2 arrives (the first sync reads one year back). Delete it in Health and Sync now: it goes. Add 70.8,
# Sync now: it arrives. Turn off and remove the imported readings.
# Run via `pnpm --filter mobile e2e` (starts the helper bridge and passes HELPER_URL).
appId: app.caltracker.client
env:
  EMAIL: client@demo.local
  PASSWORD: demo-password-123
---
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-scans, EMAIL: '${EMAIL}' }
- runFlow: helpers/health-open.yaml
- runFlow: helpers/health-clear-weights.yaml
- runFlow:
    file: helpers/health-open.yaml
- runFlow:
    file: helpers/health-add-weight.yaml
    env: { KG: '69.0', MONTHS_BACK: 14 }
- runFlow:
    file: helpers/health-open.yaml
- runFlow:
    file: helpers/health-add-weight.yaml
    env: { KG: '71.2', MONTHS_BACK: 0 }
- stopApp: com.apple.Health
# CalTracker: Progress › Metrics › Connect Apple Health.
- launchApp:
    clearState: true
- runFlow:
    file: helpers/sign-in.yaml
    env: { EMAIL: '${EMAIL}', PASSWORD: '${PASSWORD}' }
- tapOn:
    id: tab-progress
- tapOn:
    id: progress-metrics
- extendedWaitUntil:
    visible:
      id: apple-health-row
    timeout: 20000
# Nothing has been asked yet: the explainer comes first.
- tapOn:
    id: apple-health-row
- assertVisible: 'Bring in your numbers from Apple Health'
- assertVisible:
    id: health-switch-smm_kg
- takeScreenshot: apple-health-explainer
- tapOn:
    id: health-continue
# The iOS prompt: "Select All 5 Topics", scroll, Continue; then "All Recorded Data and Future Data", Allow.
- waitForAnimationToEnd
- tapOn:
    point: 50%,50%
- swipe:
    start: 50%,85%
    end: 50%,30%
- waitForAnimationToEnd
- tapOn:
    point: 50%,78%
- waitForAnimationToEnd
- tapOn:
    point: 50%,71%
- tapOn:
    point: 50%,86%
- extendedWaitUntil:
    visible:
      id: metric-meta-weight_kg
      text: '.* · from Apple Health'
    timeout: 30000
- assertVisible:
    id: metric-value-weight_kg
    text: '157.0|71.2'
# Only today's reading: the one from 14 months ago is older than the first sync reads.
- tapOn:
    id: metric-row-weight_kg
- assertVisible:
    id: metric-history-weight_kg
- assertNotVisible: '152.1 lb|69.0 kg'
- takeScreenshot: apple-health-imported
# Delete it in the Health app; Sync now removes it here too.
- runFlow: helpers/health-open.yaml
- runFlow: helpers/health-clear-weights.yaml
- stopApp: com.apple.Health
- launchApp:
    stopApp: false
- runFlow: helpers/apple-health-sync-now.yaml
- extendedWaitUntil:
    visible:
      id: metric-meta-weight_kg
      text: 'Not logged yet'
    timeout: 30000
# A new reading arrives on Sync now.
- runFlow: helpers/health-open.yaml
- runFlow:
    file: helpers/health-add-weight.yaml
    env: { KG: '70.8', MONTHS_BACK: 0 }
- stopApp: com.apple.Health
- launchApp:
    stopApp: false
- runFlow: helpers/apple-health-sync-now.yaml
- extendedWaitUntil:
    visible:
      id: metric-meta-weight_kg
      text: '.* · from Apple Health'
    timeout: 30000
# Settings › Apple Health: turn it off and remove what came in.
- tapOn:
    id: apple-health-row
- tapOn:
    id: apple-health-off
- tapOn: 'Turn off and remove imported readings'
- extendedWaitUntil:
    visible:
      id: health-continue
    timeout: 20000
- tapOn:
    id: apple-health-back
- extendedWaitUntil:
    visible:
      id: metric-meta-weight_kg
      text: 'Not logged yet'
    timeout: 20000
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-scans, EMAIL: '${EMAIL}' }
