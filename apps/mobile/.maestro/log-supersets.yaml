# The approved superset and less-text boards (SS1–SS5, LT1, LT2, LT4) on "E2E Upper Body":
#   Superset A (reps only, back to back): ticking moves the outline A1 → A2 → the next round, and the header with it;
#   Superset B (Dumbbell Bench Press each side + Side Lateral Raise, rest 1:30): Last, the each-side line once, the
#   header following the set after the last tick (round 2's leftover stays open as "1 left"), Add drop set from a
#   set's ··· (75% rounded down: 60 lb → 45 lb), the exercise ··· menu, a done round folding and opening, + Add round
#   on an uneven superset, Mark all hidden once all is ticked;
#   the bench done instead of the planned barbell ("Instead of …"); a pick-one that locks after its first set;
#   the finish sheet's short count and the coach's name.
# Run via `pnpm --filter mobile e2e` (starts the helper bridge and passes HELPER_URL).
appId: app.caltracker.client
env:
  EMAIL: client@demo.local
  PASSWORD: demo-password-123
---
- runScript:
    file: helpers/call.js
    env: { ACTION: assign-today-supersets, EMAIL: '${EMAIL}' }
- launchApp:
    clearState: true
    permissions: { notifications: allow }
- runFlow:
    file: helpers/sign-in.yaml
    env: { EMAIL: '${EMAIL}', PASSWORD: '${PASSWORD}' }
- runFlow:
    file: helpers/start-first-section.yaml
    env: { NAME: 'E2E Upper Body' }

# ---- Superset A: reps only, back to back (SS4) ----
- assertVisible:
    id: superset-intro-0
    text: 'Back to back'
- assertVisible:
    id: pages-sections
    text: 'Superset A · Round 1 of 3 ▾'
- assertVisible:
    id: round-heading-0-1
    text: 'Round 1 of 3, current round'
- takeScreenshot: ss4-1-start
- tapOn:
    id: tick-0-0-0
- takeScreenshot: ss4-2-tick-a1
- assertVisible:
    id: pages-sections
    text: 'Superset A · Round 1 of 3 ▾'
- tapOn:
    id: tick-0-1-0
- extendedWaitUntil:
    visible:
      id: pages-sections
      text: 'Superset A · Round 2 of 3 ▾'
    timeout: 5000
- assertVisible:
    id: round-0-1
    text: 'Round 1, done: 12 · 12.*'
- takeScreenshot: ss4-3-tick-a2

# ---- Superset B: the slim rows, Last, each side once (SS1) ----
- swipe:
    direction: LEFT
- extendedWaitUntil:
    visible:
      id: superset-heading-1
      text: 'Superset B'
    timeout: 5000
- assertVisible:
    id: superset-intro-1
    text: 'Back to back, then rest 1:30'
- assertVisible:
    id: last-line-1-0
    text: 'Last: 55 lb × 10'
- assertVisible:
    id: badges-help-1
    text: 'Each side.*'
# Round 1, then B1 of round 2 (B2 skipped), then B1 of round 3: the header follows the last tick.
- tapOn:
    id: tick-1-0-0
- tapOn:
    id: tick-1-1-0
- tapOn:
    id: tick-1-0-1
- scrollUntilVisible:
    element:
      id: tick-1-0-2
    direction: DOWN
- tapOn:
    id: tick-1-0-2
- extendedWaitUntil:
    visible:
      id: pages-sections
      text: 'Superset B · Round 3 of 4 ▾'
    timeout: 5000
- assertVisible:
    id: round-1-2
    text: 'Round 2, 1 left.*'
- assertVisible:
    id: round-heading-1-3
    text: 'Round 3 of 4, current round'
- takeScreenshot: ss1-after

# ---- Add drop set from the set's ··· (SS3) ----
- tapOn:
    id: set-more-1-0-2
- extendedWaitUntil:
    visible:
      id: menu-row-add-drop
    timeout: 5000
- assertVisible:
    id: menu-delete-set
- takeScreenshot: ss3-1-set-menu
- tapOn:
    id: menu-row-add-drop
- extendedWaitUntil:
    visible:
      id: tag-1-0-3
      text: '.*What does ↓ Drop mean.*'
    timeout: 5000
# 75% of 60 lb, rounded down to the 5 lb step.
- assertVisible:
    id: actual-weight-1-0-3
    text: '45'
- takeScreenshot: ss3-2-drop-added
- inputText: '8'
- pressKey: Enter
- assertVisible:
    id: actual-reps-1-0-3
    text: '8'
- tapOn:
    id: tick-1-0-3
- assertVisible:
    id: tick-1-0-3
    text: 'checkbox, checked'

# ---- The exercise ··· menu, in order (SS5) ----
- scrollUntilVisible:
    element:
      id: more-1-1
    direction: UP
- tapOn:
    id: more-1-1
- extendedWaitUntil:
    visible:
      id: menu-note
      text: 'Note for .*'
    timeout: 5000
- assertVisible:
    id: menu-history
- assertVisible:
    id: menu-info
- assertVisible:
    id: menu-add-set
- assertVisible:
    id: menu-add-drop
- assertVisible:
    id: menu-delete-a-set
- assertVisible:
    id: menu-remove-exercise
- takeScreenshot: ss5-3-exercise-menu
- tapOn: 'Cancel'

# ---- A done round folds; tap to open, tap again to fold (SS2) ----
- assertNotVisible:
    id: tick-1-1-0
- tapOn:
    id: round-1-1
- extendedWaitUntil:
    visible:
      id: tick-1-1-0
      text: 'checkbox, checked'
    timeout: 5000
- takeScreenshot: ss2-1-opened
- tapOn:
    id: round-1-1
- extendedWaitUntil:
    notVisible:
      id: tick-1-1-0
    timeout: 5000
# Opening an old round doesn't move the header.
- assertVisible:
    id: pages-sections
    text: 'Superset B · Round 3 of 4 ▾'

# ---- + Add round on the uneven superset (SS5): B2 gets round 4, both get round 5 ----
- scrollUntilVisible:
    element:
      id: add-round-1
    direction: DOWN
- takeScreenshot: ss5-1-before-add-round
- tapOn:
    id: add-round-1
- extendedWaitUntil:
    visible:
      id: pages-sections
      text: 'Superset B · Round 3 of 5 ▾'
    timeout: 5000
- scrollUntilVisible:
    element:
      id: round-heading-1-5
    direction: DOWN
- takeScreenshot: ss5-2-after-add-round
# Mark all ticks the rest; then it goes.
- runFlow:
    file: helpers/mark-all.yaml
    env: { PAGE: '1' }
- extendedWaitUntil:
    notVisible:
      id: mark-all-1
    timeout: 5000
- takeScreenshot: ss2-2-all-done

# ---- The straight page: the substitute, "Instead of …" (LT1) ----
- swipe:
    direction: LEFT
- swipe:
    direction: LEFT
- extendedWaitUntil:
    visible:
      id: exercise-name-3
    timeout: 5000
- assertVisible:
    id: pages-sections
    text: 'Exercise 4 of 5 ▾'
- tapOn:
    id: swap-3-0
- extendedWaitUntil:
    visible:
      id: substitute-sheet
    timeout: 5000
- tapOn:
    id: sub-option-1
- extendedWaitUntil:
    visible:
      id: substitute-doing-3-0
    timeout: 5000
- assertVisible: 'Doing the substitute, instead of the planned Barbell Bench Press - Medium Grip'
- assertVisible:
    id: rest-line-3-0
    text: 'Rest 1:30.*'
- assertVisible:
    id: message-3-0
- takeScreenshot: lt1-after
- tapOn:
    id: tick-3-0-0

# ---- Pick one: locks after the first set (LT2) ----
- swipe:
    direction: LEFT
- extendedWaitUntil:
    visible:
      id: option-line-4
      text: 'Locks after your first set'
    timeout: 5000
- assertVisible:
    id: pages-sections
    text: 'Pick one · 5 of 5 ▾'
- takeScreenshot: lt2-1-before-tick
- tapOn:
    id: tick-4-0-0
- extendedWaitUntil:
    visible:
      id: option-locked-4
    timeout: 5000
- assertNotVisible:
    id: option-line-4
- takeScreenshot: lt2-2-locked

# ---- The finish sheet (LT4) ----
- tapOn:
    id: page-done
- extendedWaitUntil:
    visible:
      id: finish-count
      text: '\d+ of \d+ done · \d+ unticked won’t count'
    timeout: 5000
- assertVisible: 'How did it feel\? .* sees this\.'
- takeScreenshot: lt4-1-finish-sheet
- runFlow: helpers/finish-from-sheet.yaml
- takeScreenshot: lt4-2-summary
# Tidy up.
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-logs, EMAIL: '${EMAIL}' }
