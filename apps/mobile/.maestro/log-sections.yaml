# Sections and pick-one groups ("E2E Sections", spec 2026-11-06-sections-and-choices-design.md):
#   section Upper: an uneven superset, Pullups 3 × 8 (A1, no rest) + Pushups 2 × 8 (A2, 1:00 rest);
#   section Finisher: pick one of Barbell Squat 2 × 8 @ 60 kg or Dumbbell Bicep Curl 2 × 12 @ 10 kg.
# The preview shows the section headings, each exercise as one compact "×N" line that expands to its sets, and the
# Equipment row. Logging: Start goes straight to the first set; the superset's round 3 is Pullups alone (Pushups
# has no third set, so it is left out); Next on the section's last page goes to the next section's first page.
# The finisher is one page with a switch (switchable until a set is ticked, then locked); finish, the reveal, and a
# summary that counts only the picked option's sets and lists the pick.
# Run via `pnpm --filter mobile e2e` (starts the helper bridge and passes HELPER_URL).
appId: app.caltracker.client
env:
  EMAIL: client@demo.local
  PASSWORD: demo-password-123
---
- runScript:
    file: helpers/call.js
    env: { ACTION: assign-today-sections, EMAIL: '${EMAIL}' }
- launchApp:
    clearState: true
    permissions: { notifications: allow }
- runFlow:
    file: helpers/sign-in.yaml
    env: { EMAIL: '${EMAIL}', PASSWORD: '${PASSWORD}' }
- extendedWaitUntil:
    visible: 'E2E Sections'
    timeout: 20000

# ---- Preview (the Workouts tab's Preview screen, opened from Today) ----
- tapOn:
    id: 'view-workout-.*'
- extendedWaitUntil:
    visible:
      id: plan-section-0
      text: 'Upper'
    timeout: 20000
- assertVisible: '.*Pullups.*'
- assertVisible: '.*Pushups.*'
- takeScreenshot: sections-01-preview
- scrollUntilVisible:
    element:
      id: 'plan-pick-one-.*'
    direction: DOWN
    timeout: 10000
- assertVisible: 'Pick one · you’ll choose when you get there'
- takeScreenshot: sections-03-preview-pick-one
- scrollUntilVisible:
    element:
      id: back
    direction: UP
    timeout: 10000
- tapOn:
    id: back

# ---- Upper: the uneven superset (Start goes straight to it) ----
- extendedWaitUntil:
    visible: 'Start workout'
    timeout: 10000
- tapOn: 'Start workout'
- extendedWaitUntil:
    visible:
      id: superset-heading-0
      text: 'Superset A'
    timeout: 20000
- assertVisible:
    id: round-heading-0-1
    text: 'Round 1 of 3, current round'
- assertVisible:
    id: pages-title
    text: 'E2E Sections · Upper.*'
- assertVisible:
    id: pages-sections
    text: 'Superset A · Round 1 of 3 ▾'
- takeScreenshot: sections-04-superset
- runFlow:
    file: helpers/mark-all.yaml
    env: { PAGE: '0' }
# Done rounds fold into one line each; round 3 (the last) stays open. Round 3 is Pullups alone: Pushups has only two
# sets.
- scrollUntilVisible:
    element:
      id: tick-0-0-2
      text: 'checkbox, checked'
    direction: DOWN
- assertNotVisible:
    id: tick-0-1-2
# The section's last page: Next goes straight to the next section's first page (no start page).
- assertVisible:
    id: page-done
    text: 'Next: Barbell Squat or Dumbbell Bicep Curl'
- tapOn:
    id: page-done

# ---- Finisher: one page with a switch between the options ----
- extendedWaitUntil:
    visible:
      id: option-line-0
      text: 'Locks after your first set'
    timeout: 10000
- assertVisible:
    id: pages-sections
    text: 'Pick one · 2 of 2 ▾'
- assertVisible:
    id: exercise-name-0
    text: 'Barbell Squat'

# ---- Moving freely: a swipe back into Upper and forward again, nothing logged ----
- swipe:
    direction: RIGHT
- extendedWaitUntil:
    visible:
      id: pages-title
      text: '.*Upper.*'
    timeout: 5000
- swipe:
    direction: LEFT
- extendedWaitUntil:
    visible:
      id: pages-title
      text: '.*Finisher.*'
    timeout: 5000
# The title opens the overview, which lists every section: jump to Finisher from there.
- tapOn:
    id: pages-title
- extendedWaitUntil:
    visible:
      id: workout-overview
    timeout: 5000
- assertVisible:
    id: overview-section-1
    text: 'Finisher, Pick one of 2.*'
- tapOn:
    id: overview-section-1
- extendedWaitUntil:
    visible:
      id: option-line-0
    timeout: 5000
# The switch: choose the curls (nothing ticked yet), only its sets show.
- tapOn:
    id: option-0-1
- extendedWaitUntil:
    visible:
      id: exercise-name-0
      text: 'Dumbbell Bicep Curl'
    timeout: 5000
- takeScreenshot: sections-05-option-picked
# Switch back and forth is allowed until a set is ticked.
- tapOn:
    id: option-0-0
- extendedWaitUntil:
    visible:
      id: exercise-name-0
      text: 'Barbell Squat'
    timeout: 5000
- tapOn:
    id: option-0-1
- extendedWaitUntil:
    visible:
      id: exercise-name-0
      text: 'Dumbbell Bicep Curl'
    timeout: 5000
- tapOn:
    id: tick-0-1-0
# Now the squat can't be chosen.
- extendedWaitUntil:
    visible:
      id: option-locked-0
    timeout: 5000
- assertNotVisible:
    id: option-line-0
- assertVisible:
    id: option-0-0
    enabled: false
- tapOn:
    id: tick-0-1-1
- assertVisible:
    id: page-done
    text: 'Finish workout'
- tapOn:
    id: page-done

# ---- Finish; the summary counts 3 + 2 superset sets and the 2 curls, and lists the pick ----
- extendedWaitUntil:
    visible:
      id: finish-count
      text: '7 of 7 done'
    timeout: 10000
- runFlow: helpers/finish-from-sheet.yaml
- extendedWaitUntil:
    visible: '7 of [0-9]+ sets? · .*'
    timeout: 10000
- assertVisible: 'E2E Sections'
- assertVisible: '.*Finisher: picked Dumbbell Bicep Curl.*'
- tapOn:
    id: summary-done
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-logs, EMAIL: '${EMAIL}' }
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-workouts, EMAIL: '-' }
