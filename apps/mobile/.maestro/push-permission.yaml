# Today's notifications banner (below the workout card): it shows while iOS has never asked, "Turn on" brings up the
# system alert, and once answered the banner is gone. × (Not now) hides it (also after a relaunch) for 7 days, for good
# after the second time. Starting a workout never asks.
# Run via `pnpm --filter mobile e2e .maestro/push-permission.yaml`. The demo client has workouts, so Today is not the
# first-time welcome.
appId: app.caltracker.client
env:
  EMAIL: client@demo.local
  PASSWORD: demo-password-123
---
# 1. Allow.
- launchApp:
    clearState: true
    permissions: { notifications: unset }
- runFlow:
    file: helpers/sign-in.yaml
    env: { EMAIL: '${EMAIL}', PASSWORD: '${PASSWORD}' }
- extendedWaitUntil:
    visible:
      id: today-date
    timeout: 20000
- scrollUntilVisible:
    element:
      id: push-card
    direction: DOWN
- assertVisible: 'Get a ping when .* sends a workout or message.'
- takeScreenshot: push-card-phone
- tapOn:
    id: push-card-allow
- tapOn: 'Allow'
- assertNotVisible:
    id: push-card
# 2. Later, and it stays hidden after a relaunch.
- launchApp:
    clearState: true
    permissions: { notifications: unset }
- runFlow:
    file: helpers/sign-in.yaml
    env: { EMAIL: '${EMAIL}', PASSWORD: '${PASSWORD}' }
- extendedWaitUntil:
    visible:
      id: today-date
    timeout: 20000
- scrollUntilVisible:
    element:
      id: push-card
    direction: DOWN
- tapOn:
    id: push-card-later
- assertNotVisible:
    id: push-card
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: today-date
    timeout: 20000
- assertNotVisible:
    id: push-card
# 3. Starting a workout never asks (only Turn on does), even while iOS has never asked.
- runScript:
    file: helpers/call.js
    env: { ACTION: assign-today, EMAIL: '${EMAIL}' }
- launchApp:
    clearState: true
    permissions: { notifications: unset }
- runFlow:
    file: helpers/sign-in.yaml
    env: { EMAIL: '${EMAIL}', PASSWORD: '${PASSWORD}' }
- runFlow:
    file: helpers/start-first-section.yaml
    env: { NAME: 'E2E Log' }
- assertNotVisible: '.*Would Like to Send You Notifications.*'
- tapOn:
    id: close-section
- tapOn: 'Discard workout'
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-logs, EMAIL: '${EMAIL}' }
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-workouts, EMAIL: '-' }
