# The phone's tab bar has exactly five tabs: Today, Workouts, Coach, Food and Progress. The Zoo book is no longer a
# tab: it opens from the card at the top of Progress.
appId: app.caltracker.client
env:
  EMAIL: client@demo.local
  PASSWORD: demo-password-123
---
- launchApp:
    clearState: true
- runFlow:
    file: helpers/sign-in.yaml
    env: { EMAIL: '${EMAIL}', PASSWORD: '${PASSWORD}' }
- assertVisible:
    id: tab-today
- assertVisible:
    id: tab-workouts
- assertVisible:
    id: tab-coach
- assertVisible:
    id: tab-food
- assertVisible:
    id: tab-progress
- assertNotVisible:
    id: tab-zoo
- assertNotVisible:
    id: tab-community
- assertNotVisible:
    id: tab-me
- tapOn:
    id: tab-progress
- tapOn:
    id: progress-zoo
- extendedWaitUntil:
    visible: 'Zoo book'
    timeout: 10000
- tapOn:
    id: zoo-back
- assertVisible:
    id: progress-zoo
- takeScreenshot: tabs-phone
