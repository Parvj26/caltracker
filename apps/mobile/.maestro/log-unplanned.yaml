# An unplanned workout: Workouts → Log a workout, name it "Run", add an exercise, tick one of its three sets and
# finish. The client is asked about the two sets not done, then sees the summary.
# Run via `pnpm --filter mobile e2e` (starts the helper bridge and passes HELPER_URL).
appId: app.caltracker.client
env:
  EMAIL: client@demo.local
  PASSWORD: demo-password-123
---
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-logs, EMAIL: '${EMAIL}' }
- launchApp:
    clearState: true
- runFlow:
    file: helpers/sign-in.yaml
    env: { EMAIL: '${EMAIL}', PASSWORD: '${PASSWORD}' }
- tapOn:
    id: tab-workouts
- tapOn:
    id: log-unplanned
- assertVisible:
    id: unplanned-name
- tapOn:
    id: unplanned-name
- eraseText
- inputText: 'Run'
- tapOn:
    id: unplanned-start
- tapOn:
    text: Allow
    optional: true
- extendedWaitUntil:
    visible:
      id: add-exercise
    timeout: 20000
- assertVisible: 'Run'
- tapOn:
    id: add-exercise
- tapOn:
    id: exercise-search
- inputText: 'push'
- extendedWaitUntil:
    visible:
      id: exercise-result-0
    timeout: 20000
- tapOn:
    id: exercise-result-0
- extendedWaitUntil:
    visible:
      id: tick-0-0
    timeout: 10000
- tapOn:
    id: tick-0-0
# Added exercises have no rest set, so no rest sheet; close it if one shows.
- tapOn:
    id: rest-skip
    optional: true
- tapOn:
    id: log-menu
- tapOn:
    id: finish-button
- extendedWaitUntil:
    visible: 'Finish with 2 sets not done\? They won’t count\.'
    timeout: 10000
- tapOn: 'Finish'
# The sticker reveal may come first (a short unplanned session can earn no card and go straight to the summary),
# so this tap is optional.
- tapOn:
    id: reveal-continue
    optional: true
- extendedWaitUntil:
    visible: '1 set completed'
    timeout: 10000
- assertVisible: 'Run'
- assertVisible: 'Coach comments'
- tapOn:
    id: summary-done
- extendedWaitUntil:
    visible: 'Workouts'
    timeout: 10000
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-logs, EMAIL: '${EMAIL}' }
