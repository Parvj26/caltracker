# An unplanned workout: Workouts → Log a workout, name it "Run", add an exercise, do one of its three sets and
# finish. The client is asked about the two sets not done, then sees the summary.
# Run via `pnpm --filter mobile e2e` (starts the helper bridge and passes HELPER_URL).
appId: app.caltracker.client
env:
  EMAIL: client@demo.local
  PASSWORD: demo-password-123
---
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-logs, EMAIL: '${EMAIL}' }
- launchApp:
    clearState: true
    # Granted up front: tapping the system's Allow could land on the page underneath as the alert closes.
    permissions: { notifications: allow }
- runFlow:
    file: helpers/sign-in.yaml
    env: { EMAIL: '${EMAIL}', PASSWORD: '${PASSWORD}' }
- tapOn:
    id: tab-workouts
- tapOn:
    id: log-unplanned
- assertVisible:
    id: unplanned-name
- tapOn:
    id: unplanned-name
- eraseText
- inputText: 'Run'
- tapOn:
    id: unplanned-start
- extendedWaitUntil:
    visible:
      id: add-exercise
    timeout: 20000
# The logging screen has no title; the summary below shows the name.
- tapOn:
    id: add-exercise
- tapOn:
    id: exercise-search
- inputText: 'push'
- extendedWaitUntil:
    visible:
      id: exercise-result-0
    timeout: 20000
- tapOn:
    id: exercise-result-0
- extendedWaitUntil:
    visible:
      id: done-0
    timeout: 10000
# Pushups count reps only: one more than the pre-fill.
- tapOn:
    id: stepper-reps-plus-0
- tapOn:
    id: done-0
# Added exercises have no rest set, so no rest panel; close it if one shows.
- tapOn:
    id: rest-skip
    optional: true
- tapOn:
    id: finish-workout
- extendedWaitUntil:
    visible: 'Finish with 2 sets not done\? They won’t count\.'
    timeout: 10000
- tapOn: 'Finish'
- extendedWaitUntil:
    visible: '1 set completed'
    timeout: 10000
- assertVisible: 'Run'
- assertVisible: 'Coach comments'
- tapOn:
    id: summary-done
- extendedWaitUntil:
    visible: 'Workouts'
    timeout: 10000
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-logs, EMAIL: '${EMAIL}' }
