# An unplanned workout: Workouts → Log a workout, name it "Run", add an exercise from the overview, change the
# reps on set 1, tick it and finish. The Finish workout? sheet says the other two sets aren't ticked and will be
# saved as not done; then the reveal and the summary.
# Run via `pnpm --filter mobile e2e` (starts the helper bridge and passes HELPER_URL).
appId: app.caltracker.client
env:
  EMAIL: client@demo.local
  PASSWORD: demo-password-123
---
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-logs, EMAIL: '${EMAIL}' }
- launchApp:
    clearState: true
    # Granted up front: tapping the system's Allow could land on the page underneath as the alert closes.
    permissions: { notifications: allow }
- runFlow:
    file: helpers/sign-in.yaml
    env: { EMAIL: '${EMAIL}', PASSWORD: '${PASSWORD}' }
- tapOn:
    id: tab-workouts
- tapOn:
    id: log-unplanned
- assertVisible:
    id: unplanned-name
- tapOn:
    id: unplanned-name
- eraseText
- inputText: 'Run'
- tapOn:
    id: unplanned-start
# An empty workout opens on its overview, named as typed.
- extendedWaitUntil:
    visible:
      id: overview-name
      text: 'Run'
    timeout: 20000
- tapOn:
    id: add-exercise
- tapOn:
    id: exercise-search
- inputText: 'push'
- extendedWaitUntil:
    visible:
      id: exercise-result-0
    timeout: 20000
- tapOn:
    id: exercise-result-0
- extendedWaitUntil:
    visible:
      id: page-done
    timeout: 10000
# Pushups count reps only: one REPS column, typed straight into the box.
- tapOn:
    id: actual-reps-0-0-0
- waitForAnimationToEnd
- inputText: '12'
- tapOn:
    id: tick-0-0-0
- assertVisible:
    id: tick-0-0-0
    text: 'checkbox, checked'
- assertVisible:
    id: actual-reps-0-0-0
    text: '12'
- tapOn:
    id: page-done
- extendedWaitUntil:
    visible:
      id: finish-sheet
    timeout: 10000
- assertVisible:
    id: finish-count
    text: '1 of 3 sets done. 2 sets of .* aren’t ticked; they’ll be saved as not done.'
- runFlow: helpers/finish-from-sheet.yaml
- extendedWaitUntil:
    visible: '1 set completed'
    timeout: 10000
- assertVisible: 'Run'
- assertVisible: 'Coach comments'
- tapOn:
    id: summary-done
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-logs, EMAIL: '${EMAIL}' }
