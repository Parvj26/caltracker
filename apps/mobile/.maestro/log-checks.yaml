# Edge cases of the logging pages on "E2E Mixed" (squat W + 2 sets; superset Pullups + Pushups; curls with drops):
# ✓ with the keyboard still up saves the typed number, a fast double tap on ✓ stays ticked, no "Not synced yet"
# pill while online, the history and note buttons, Swap and Remove from the ••• menu, + Add exercise from the
# overview opening the new page, and Discard from the overview.
# Run via `pnpm --filter mobile e2e` (starts the helper bridge and passes HELPER_URL).
appId: app.caltracker.client
env:
  EMAIL: client@demo.local
  PASSWORD: demo-password-123
---
- runScript:
    file: helpers/call.js
    env: { ACTION: assign-today-mixed, EMAIL: '${EMAIL}' }
- launchApp:
    clearState: true
    permissions: { notifications: allow }
- runFlow:
    file: helpers/sign-in.yaml
    env: { EMAIL: '${EMAIL}', PASSWORD: '${PASSWORD}' }
- runFlow:
    file: helpers/start-first-section.yaml
    env: { NAME: 'E2E Mixed' }

# ---- ✓ with the keyboard up: the typed weight is what is saved ----
- tapOn:
    id: actual-weight-0-0-0
- waitForAnimationToEnd
# Let the keypad finish coming up (the page scrolls the box above it) before typing.
- waitForAnimationToEnd
- inputText: '50'
- tapOn:
    id: tick-0-0-0
- assertVisible:
    id: tick-0-0-0
    text: 'checkbox, checked'
- assertVisible:
    id: actual-weight-0-0-0
    text: '50'

# ---- A fast double tap on ✓ is one tap: the set stays ticked ----
- doubleTapOn:
    id: tick-0-0-1
- assertVisible:
    id: tick-0-0-1
    text: 'checkbox, checked'
# ---- A number that can't be saved says why, and the saved one comes back ----
- tapOn:
    id: actual-reps-0-0-2
- waitForAnimationToEnd
- inputText: '12.5'
- extendedWaitUntil:
    visible:
      id: invalid-actual-reps-0-0-2
      text: 'Whole reps only'
    timeout: 5000
# Done typing (Enter ends editing; the simulator has no on-screen keypad, so its Done typing bar can't show).
- pressKey: Enter
- assertNotVisible:
    id: invalid-actual-reps-0-0-2
# A ticked set's box can't be left blank.
- tapOn:
    id: actual-weight-0-0-0
- waitForAnimationToEnd
- eraseText
- extendedWaitUntil:
    visible:
      id: invalid-actual-weight-0-0-0
      text: 'A ticked set needs a number'
    timeout: 5000
# Done typing (Enter ends editing; the simulator has no on-screen keypad, so its Done typing bar can't show).
- pressKey: Enter
- assertVisible:
    id: actual-weight-0-0-0
    text: '50'
# Online, with every change uploaded: no "Not synced yet".
- assertNotVisible:
    id: sync-pill

# ---- History: nothing yet for this client ----
- tapOn:
    id: history-0-0
- extendedWaitUntil:
    visible:
      id: history-sheet
    timeout: 5000
- assertVisible: 'Last time · Barbell Squat'
- assertVisible: 'No history yet.*'
- tapOn:
    id: history-sheet-ok

# ---- Note for the coach (✉) shows on the page ----
- tapOn:
    id: message-0-0
- extendedWaitUntil:
    visible:
      id: note-input
    timeout: 5000
- inputText: 'Knee felt fine'
- tapOn:
    id: note-save
- extendedWaitUntil:
    visible:
      id: exercise-note-0-0
      text: 'Note: Knee felt fine'
    timeout: 5000

# ---- ••• → Swap exercise on the curls ----
- tapOn:
    id: dot-2
- extendedWaitUntil:
    visible:
      id: exercise-name-2
      text: 'Dumbbell Bicep Curl'
    timeout: 5000
- tapOn:
    id: more-2-0
- tapOn:
    id: menu-swap
- extendedWaitUntil:
    visible:
      id: exercise-search
    timeout: 10000
- tapOn:
    id: exercise-search
- inputText: 'hammer curl'
- extendedWaitUntil:
    visible:
      id: exercise-result-0
    timeout: 20000
- tapOn:
    id: exercise-result-0
- extendedWaitUntil:
    visible:
      id: exercise-name-2
      text: '.*Hammer.*'
    timeout: 10000

# ---- ••• → Remove exercise on the superset's A2: the superset becomes a straight Pullups page ----
- tapOn:
    id: dot-1
- extendedWaitUntil:
    visible:
      id: superset-heading-1
    timeout: 5000
- tapOn:
    id: more-1-1
- tapOn:
    id: menu-remove-exercise
- tapOn: 'Remove'
- extendedWaitUntil:
    visible:
      id: exercise-name-1
      text: 'Pullups'
    timeout: 10000

# ---- ✕, ⌄, then + Add exercise on the overview: the new exercise's page opens ----
- tapOn:
    id: close-section
- tapOn:
    id: section-back
- extendedWaitUntil:
    visible:
      id: workout-overview
    timeout: 5000
- scrollUntilVisible:
    element:
      id: add-exercise
    direction: DOWN
- tapOn:
    id: add-exercise
- tapOn:
    id: exercise-search
- inputText: 'plank'
- extendedWaitUntil:
    visible:
      id: exercise-result-0
    timeout: 20000
- tapOn:
    id: exercise-result-0
- extendedWaitUntil:
    visible:
      id: exercise-name-3
      text: '.*Plank.*'
    timeout: 10000
# A timed exercise: one TIME column, typed as m:ss.
- tapOn:
    id: actual-duration-3-0-0
- waitForAnimationToEnd
- inputText: '1:15'
- tapOn:
    id: tick-3-0-0
- assertVisible:
    id: actual-duration-3-0-0
    text: '1:15'

# ---- Discard from the overview ----
- tapOn:
    id: close-section
- tapOn:
    id: section-back
- scrollUntilVisible:
    element:
      id: discard-workout
    direction: DOWN
- tapOn:
    id: discard-workout
- tapOn: 'Discard'
- extendedWaitUntil:
    visible: 'Start workout'
    timeout: 20000
- assertNotVisible:
    id: resume-banner
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-logs, EMAIL: '${EMAIL}' }
- runScript:
    file: helpers/call.js
    env: { ACTION: cleanup-workouts, EMAIL: '-' }
