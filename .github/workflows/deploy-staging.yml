name: Deploy staging

# Deploys migrations, the Edge Functions (send-invite, accept-invite) and the web app to staging.
# Automatic runs start only after the CI workflow succeeds on a push to main (workflow_run), so a red merge never
# reaches staging. Manual runs must be started from main.
# Uses repository secrets (GitHub Environments are not available on this plan). See docs/runbooks/staging.md.
# Jobs run on the self-hosted Mac runner (`caltracker-mac`). None of them starts a local Supabase stack: they talk to
# the hosted staging project only. To go back to GitHub-hosted runners, change every `runs-on` back to `ubuntu-latest`.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: 'Seed action (only used by the seed-staging job; leave "deploy" to just deploy)'
        type: choice
        options: [deploy, import-exercises, provision-coach]
        default: deploy
      coach_email:
        description: 'provision-coach: coach email'
        type: string
        required: false
      coach_first_name:
        description: 'provision-coach: coach first name'
        type: string
        required: false
      coach_last_name:
        description: 'provision-coach: coach last name (optional)'
        type: string
        required: false
      workspace_name:
        description: 'provision-coach: workspace name'
        type: string
        required: false

permissions:
  contents: read

env:
  SUPABASE_CLI_VERSION: 2.67.1
  STAGING_SITE_URL: https://staging.caltracker.app

jobs:
  require-main:
    # Fail loudly instead of silently skipping every job when a manual run starts from another branch.
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: [self-hosted, caltracker-mac]
    steps:
      - run: |
          echo "::error::Run this workflow from main"
          exit 1

  deploy:
    # Manual run from main, or an automatic run after CI passed for a push to main.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.action == 'deploy') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: [self-hosted, caltracker-mac]
    outputs:
      # 'true' when a newer commit is already on main: nothing was deployed and the smoke job must not run.
      skip: ${{ steps.newest.outputs.skip }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
      STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
    steps:
      # First, so a missing secret fails before anything touches the staging database.
      - name: Require the Resend API key
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::error::Secret RESEND_API_KEY is not set, so invite emails would silently stay on the local mail catcher. See docs/runbooks/staging.md."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit CI passed on (workflow_run); the dispatched ref otherwise.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Check this commit is still the newest on main
        id: newest
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Deploys can queue behind each other. Never let an older commit overwrite a newer deploy.
          head_sha="$(git rev-parse HEAD)"
          main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ -z "$main_sha" ]; then
            echo "::error::Could not read the tip of main (git ls-remote returned nothing), so the deploy order cannot be checked."
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "workflow_run" ] && [ "$head_sha" != "$main_sha" ]; then
            echo "::notice::Skipping: $head_sha is no longer the tip of main ($main_sha). A newer commit will deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.newest.outputs.skip != 'true'
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - if: steps.newest.outputs.skip != 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: steps.newest.outputs.skip != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.newest.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      # Build before anything changes on staging: a failed build stops the deploy with the database, function and
      # web app all still on the old version, and the gap between the new function and the new web app shrinks to
      # the few seconds of cf:deploy.
      - name: Build web app for Cloudflare
        if: steps.newest.outputs.skip != 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: pnpm --filter web cf:build

      - name: Link Supabase staging project
        if: steps.newest.outputs.skip != 'true'
        run: supabase link --project-ref "$STAGING_SUPABASE_PROJECT_REF"

      - name: Apply database migrations
        if: steps.newest.outputs.skip != 'true'
        run: supabase db push --include-all

      - name: Set Edge Function secrets
        if: steps.newest.outputs.skip != 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          supabase secrets set --project-ref "$STAGING_SUPABASE_PROJECT_REF" \
            "PUBLIC_SITE_URL=$STAGING_SITE_URL" \
            "RESEND_API_KEY=$RESEND_API_KEY" \
            "INVITE_FROM_EMAIL=CalTracker <invites@caltracker.app>"

      - name: Deploy Edge Functions
        if: steps.newest.outputs.skip != 'true'
        run: pnpm functions:deploy --project-ref "$STAGING_SUPABASE_PROJECT_REF"

      - name: Deploy web app to Cloudflare Workers
        if: steps.newest.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter web cf:deploy

  smoke:
    needs: deploy
    # Skipped (not failed) when the deploy job stood down because a newer commit is on main.
    if: >-
      needs.deploy.outputs.skip != 'true' && (
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: [self-hosted, caltracker-mac]
    concurrency:
      group: deploy-staging-smoke
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit CI passed on (workflow_run); the dispatched ref otherwise.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # --with-deps installs system packages with apt, which only exists on Linux runners.
      - run: pnpm exec playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
        working-directory: apps/web
      - name: Smoke test staging (includes the session-refresh check)
        run: |
          if [ -z "$STAGING_SMOKE_COACH_EMAIL" ] || [ -z "$STAGING_SMOKE_COACH_PASSWORD" ]; then
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::warning::STAGING_SMOKE_COACH_EMAIL / STAGING_SMOKE_COACH_PASSWORD not set: the sign-in and session-refresh check will be skipped (allowed on manual runs only)."
            else
              echo "::error::STAGING_SMOKE_COACH_EMAIL / STAGING_SMOKE_COACH_PASSWORD are not set, so the session-refresh check cannot run. Add them (see docs/runbooks/staging.md)."
              exit 1
            fi
          fi
          pnpm --filter web test:e2e:staging
        env:
          EVENT_NAME: ${{ github.event_name }}
          STAGING_URL: ${{ env.STAGING_SITE_URL }}
          STAGING_SMOKE_COACH_EMAIL: ${{ secrets.STAGING_SMOKE_COACH_EMAIL }}
          STAGING_SMOKE_COACH_PASSWORD: ${{ secrets.STAGING_SMOKE_COACH_PASSWORD }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: staging-smoke-report
          path: apps/web/test-results
          retention-days: 7

  seed-staging:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.action != 'deploy'
    runs-on: [self-hosted, caltracker-mac]
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      PUBLIC_SITE_URL: https://staging.caltracker.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit CI passed on (workflow_run); the dispatched ref otherwise.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require the service role key
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Secret STAGING_SUPABASE_SERVICE_ROLE_KEY is not set. See docs/runbooks/staging.md."
            exit 1
          fi
      - name: Import exercises
        if: inputs.action == 'import-exercises'
        run: pnpm import:exercises
      - name: Provision coach
        if: inputs.action == 'provision-coach'
        env:
          COACH_EMAIL: ${{ inputs.coach_email }}
          COACH_FIRST_NAME: ${{ inputs.coach_first_name }}
          COACH_LAST_NAME: ${{ inputs.coach_last_name }}
          WORKSPACE_NAME: ${{ inputs.workspace_name }}
        run: |
          if [ -z "$COACH_EMAIL" ] || [ -z "$COACH_FIRST_NAME" ] || [ -z "$WORKSPACE_NAME" ]; then
            echo "::error::coach_email, coach_first_name and workspace_name are all required for provision-coach (coach_last_name is optional)."
            exit 1
          fi
          pnpm provision:coach --email "$COACH_EMAIL" --first-name "$COACH_FIRST_NAME" --last-name "$COACH_LAST_NAME" --workspace "$WORKSPACE_NAME"
